    <!-- ============================================================
     N5 MATCHING DATA - 100% Reliable
     All 103 N5 Kanji with primary readings
     ============================================================ -->
    <script src="n5-matching-data.js"></script>

    <!-- ============================================================
     GAME LOGIC WITH PAUSE + SAVE FEATURES + QUIZ MODE + FURIGANA + TTS
     ============================================================ -->
    <script>
      // ============================================================
      // FURIGANA HELPER FUNCTIONS
      // ============================================================

      /**
       * Convert a sentence with furigana notation to HTML with furigana
       * Input: "毎日（まいにち）コーヒーを飲（の）みます"
       * Output: HTML with furigana above kanji in dark red
       */
      function addFurigana(text) {
        if (!text) return '';
        
        // Match pattern: kanji followed by (reading) in parentheses
        // e.g., "毎日（まいにち）" -> kanji="毎日", reading="まいにち"
        const pattern = /([一-龯々]+)（([\u3040-\u309F\u30A0-\u30FF]+)）/g;
        
        let result = text;
        let matches = [];
        let match;
        
        // Find all matches
        while ((match = pattern.exec(text)) !== null) {
          matches.push({
            kanji: match[1],
            reading: match[2],
            fullMatch: match[0],
            index: match.index
          });
        }
        
        // Replace from end to start to preserve indices
        for (let i = matches.length - 1; i >= 0; i--) {
          const m = matches[i];
          const furiganaHtml = `<span class="furigana"><span class="reading dark-red">${m.reading}</span><span class="kanji">${m.kanji}</span></span>`;
          result = result.substring(0, m.index) + furiganaHtml + result.substring(m.index + m.fullMatch.length);
        }
        
        return result;
      }

      /**
       * Add furigana to a sentence, handling the blank placeholder
       */
      function addFuriganaWithBlank(text) {
        if (!text) return '';
        // First add furigana to the whole text
        let withFurigana = addFurigana(text);
        // Then replace any remaining ___ with the blank span
        withFurigana = withFurigana.replace(/___/g, '<span class="blank">___</span>');
        return withFurigana;
      }

      /**
       * Get furigana HTML for a single kanji
       */
      function getFuriganaForKanji(kanji, hiragana) {
        if (!kanji || !hiragana) return kanji || '';
        return `<span class="furigana"><span class="reading dark-red">${hiragana}</span><span class="kanji">${kanji}</span></span>`;
      }

      /**
       * Display a sentence with furigana in the explanation
       */
      function displaySentenceWithFurigana(sentence) {
        if (!sentence) return '';
        return addFurigana(sentence);
      }

      /**
       * Strip furigana notation from a sentence for TTS
       * "毎日（まいにち）コーヒーを飲（の）みます" -> "毎日コーヒーを飲みます"
       */
      function stripFuriganaForTTS(text) {
        if (!text) return '';
        // Remove the (reading) parts but keep the kanji
        return text.replace(/（[\u3040-\u309F\u30A0-\u30FF]+）/g, '');
      }

      /**
       * Get the clean sentence for TTS (without furigana notation)
       */
      function getCleanSentenceForTTS(sentence) {
        if (!sentence) return '';
        // First strip furigana notation
        let clean = stripFuriganaForTTS(sentence);
        // Remove any extra spaces
        clean = clean.replace(/\s+/g, ' ');
        return clean.trim();
      }

      // ============================================================
      // TTS (TEXT-TO-SPEECH) HELPER FUNCTIONS
      // ============================================================

      /**
       * Speak Japanese text using the browser's Speech Synthesis API
       */
      function speakJapanese(text) {
        if (!window.speechSynthesis) {
          messageDiv.innerHTML = '⚠️ Speech not supported in this browser.';
          return;
        }

        // Cancel any ongoing speech
        window.speechSynthesis.cancel();

        // Clean the text for TTS - remove any furigana notation
        const cleanText = getCleanSentenceForTTS(text);
        
        if (!cleanText) {
          messageDiv.innerHTML = '⚠️ No text to speak.';
          return;
        }

        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'ja-JP';
        utterance.rate = 0.85;
        utterance.pitch = 1;
        
        // Try to find a Japanese voice
        const voices = window.speechSynthesis.getVoices();
        const japaneseVoice = voices.find(v => v.lang.startsWith('ja'));
        if (japaneseVoice) {
          utterance.voice = japaneseVoice;
        }

        utterance.onend = () => {
          // Optional: update message when done
        };
        
        utterance.onerror = () => {
          messageDiv.innerHTML = '⚠️ Speech error. Please try again.';
        };

        window.speechSynthesis.speak(utterance);
        return cleanText;
      }

      /**
       * Prime the speech synthesis system (required on some browsers)
       */
      function primeSpeech() {
        if (window.speechSynthesis) {
          const dummy = new SpeechSynthesisUtterance('');
          window.speechSynthesis.speak(dummy);
          window.speechSynthesis.cancel();
          // Load voices
          window.speechSynthesis.getVoices();
        }
      }

      // ============================================================
      // CONSTANTS & STATE
      // ============================================================

      const SAVE_KEY = "kanjiMasterSave_v2";
      const SETTINGS_KEY = "kanjiMasterSettings";
      const QUIZ_KEY = "kanjiMasterQuiz_v1";

      // Game state
      let currentOriginalSetIndex = 0;
      let carryoverPairs = [];
      let activeDeck = [];
      let selectedCardIndex = null;
      let lockBoard = false;
      let totalScore = 0;
      let currentlyMatchedCount = 0;
      let totalPairsInActiveDeck = 0;
      let gameCompleted = false;
      let totalSets = 0;
      let isWaitingForNext = false;

      // Quiz state
      let isQuizMode = false;
      let quizQuestions = [];
      let quizCurrentIndex = 0;
      let quizScore = 0;
      let quizAnswered = false;
      let quizCorrectCount = 0;
      let quizWrongCount = 0;
      let quizSkippedCount = 0;
      let quizCompleted = false;
      let quizAnsweredSet = new Set();

      // Translation toggle state
      let showTranslation = false;

      // Pause state
      let isPaused = false;
      let saveTimer = null;
      let autoSaveEnabled = true;

      // DOM references
      const gridContainer = document.getElementById("gameGrid");
      const scoreSpan = document.getElementById("scoreValue");
      const setCounterSpan = document.getElementById("setCounter");
      const totalSetsSpan = document.getElementById("totalSets");
      const carrySpan = document.getElementById("carryCount");
      const messageDiv = document.getElementById("gameMessage");
      const progressFill = document.getElementById("progressFill");
      const statusBadge = document.getElementById("statusBadge");
      const pauseBtn = document.getElementById("pauseBtn");
      const saveBtn = document.getElementById("saveBtn");
      const resetBtn = document.getElementById("resetBtn");
      const showStatsBtn = document.getElementById("showStatsBtn");
      const pairsPerSetSelect = document.getElementById("pairsPerSet");
      const autoSaveToggle = document.getElementById("autoSaveToggle");
      const quizBtn = document.getElementById("quizBtn");

      // ============================================================
      // SETTINGS
      // ============================================================

      function getSettings() {
        try {
          const saved = localStorage.getItem(SETTINGS_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            return {
              pairsPerSet: parsed.pairsPerSet || 6,
              autoSave: parsed.autoSave !== undefined ? parsed.autoSave : true,
            };
          }
        } catch (e) {}
        return { pairsPerSet: 6, autoSave: true };
      }

      function saveSettings() {
        const settings = {
          pairsPerSet: parseInt(pairsPerSetSelect.value),
          autoSave: autoSaveToggle.checked,
        };
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        autoSaveEnabled = settings.autoSave;
      }

      function loadSettings() {
        const settings = getSettings();
        pairsPerSetSelect.value = settings.pairsPerSet;
        autoSaveToggle.checked = settings.autoSave;
        autoSaveEnabled = settings.autoSave;
        return settings;
      }

      // ============================================================
      // SAVE / LOAD
      // ============================================================

      function saveGameState() {
        if (!autoSaveEnabled) return;

        try {
          const state = {
            currentOriginalSetIndex: currentOriginalSetIndex,
            carryoverPairs: carryoverPairs,
            totalScore: totalScore,
            gameCompleted: gameCompleted,
            activeDeckState: activeDeck.map((card) => ({
              id: card.id,
              displayValue: card.displayValue,
              matchId: card.matchId,
              type: card.type,
              matched: card.matched,
              pairRef: card.pairRef
                ? {
                    id: card.pairRef.id,
                    kanji: card.pairRef.kanji,
                    hiragana: card.pairRef.hiragana,
                    meaning: card.pairRef.meaning || "",
                  }
                : null,
            })),
            selectedCardIndex: selectedCardIndex,
            currentlyMatchedCount: currentlyMatchedCount,
            totalPairsInActiveDeck: totalPairsInActiveDeck,
            isPaused: isPaused,
            timestamp: Date.now(),
            version: 2,
          };
          localStorage.setItem(SAVE_KEY, JSON.stringify(state));
        } catch (e) {
          console.warn("Failed to save:", e);
        }
      }

      function loadGameState() {
        try {
          const saved = localStorage.getItem(SAVE_KEY);
          if (!saved) return null;

          const state = JSON.parse(saved);
          if (state.version !== 2) {
            console.warn("Old save version, discarding");
            return null;
          }
          return state;
        } catch (e) {
          return null;
        }
      }

      function clearSave() {
        localStorage.removeItem(SAVE_KEY);
      }

      // ============================================================
      // QUIZ FUNCTIONS
      // ============================================================

      function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function getRandomOptions(correctId, count = 3) {
        const correct = N5_MATCHING_DATA.find(d => d.id === correctId);
        if (!correct) return [];

        const others = N5_MATCHING_DATA.filter(d => d.id !== correctId);
        const shuffled = shuffleArray([...others]);
        
        const distractors = shuffled.slice(0, count);
        let options = distractors.map(d => d.kanji);
        options.push(correct.kanji);
        
        return shuffleArray(options);
      }

      function generateQuizQuestions() {
        const questions = [];
        const usedIndices = new Set();
        
        const available = N5_MATCHING_DATA.filter(d => d.example && d.example.sentence);
        const shuffled = shuffleArray([...available]);
        const count = Math.min(shuffled.length, 50);
        
        for (let i = 0; i < count; i++) {
          const data = shuffled[i];
          if (!data.example) continue;
          
          const sentence = data.example.sentence;
          const kanji = data.kanji;
          const reading = data.hiragana || '';
          const meaning = data.meaning || '';
          
          // Find where the kanji appears in the sentence
          const kanjiIndex = sentence.indexOf(kanji);
          
          let displaySentence;
          if (kanjiIndex !== -1) {
            // Replace the kanji with a blank
            const furiganaPattern = new RegExp(kanji + '（[\\u3040-\\u309F\\u30A0-\\u30FF]+）');
            const match = sentence.match(furiganaPattern);
            
            if (match) {
              displaySentence = sentence.replace(match[0], '___');
            } else {
              displaySentence = sentence.replace(kanji, '___');
            }
          } else {
            displaySentence = sentence;
          }
          
          // Get options
          const options = getRandomOptions(data.id, 3);
          
          questions.push({
            id: data.id,
            kanji: kanji,
            reading: reading,
            meaning: meaning,
            displaySentence: displaySentence,
            originalSentence: sentence,
            readingFull: data.example.reading || '',
            english: data.example.english || '',
            options: options,
            correctAnswer: kanji,
            hint: `This kanji means "${meaning}" and is read as "${reading}"`
          });
        }
        
        return shuffleArray(questions);
      }

      // ============================================================
      // TRANSLATION TOGGLE FUNCTION
      // ============================================================

      function toggleTranslation() {
        showTranslation = !showTranslation;
        const translationElement = document.querySelector('.quiz-translation');
        if (translationElement) {
          if (showTranslation) {
            translationElement.classList.add('visible');
          } else {
            translationElement.classList.remove('visible');
          }
        }
        // Save preference
        try {
          localStorage.setItem('showTranslation', JSON.stringify(showTranslation));
        } catch (e) {}
      }

      function loadTranslationPreference() {
        try {
          const saved = localStorage.getItem('showTranslation');
          if (saved !== null) {
            showTranslation = JSON.parse(saved);
          }
        } catch (e) {}
        return showTranslation;
      }

      // ============================================================
      // RENDER QUIZ WITH TRANSLATION TOGGLE
      // ============================================================

      function renderQuiz() {
        if (quizCompleted) {
          renderQuizComplete();
          return;
        }

        if (quizQuestions.length === 0) {
          quizQuestions = generateQuizQuestions();
          quizCurrentIndex = 0;
          quizScore = 0;
          quizCorrectCount = 0;
          quizWrongCount = 0;
          quizSkippedCount = 0;
          quizAnswered = false;
          quizAnsweredSet = new Set();
        }

        const question = quizQuestions[quizCurrentIndex];
        if (!question) {
          quizCompleted = true;
          renderQuizComplete();
          return;
        }

        const total = quizQuestions.length;
        const current = quizCurrentIndex + 1;

        // Build the quiz HTML with furigana and translation toggle
        let html = `
          <div class="quiz-container">
            <div class="quiz-progress">
              <span>📝 Question ${current}/${total}</span>
              <span class="quiz-score">⭐ ${quizCorrectCount} correct</span>
            </div>
            <div class="quiz-sentence">
              <div class="sentence-text">
                ${addFuriganaWithBlank(question.displaySentence)}
              </div>
              <div class="quiz-translation ${showTranslation ? 'visible' : ''}">
                ${question.english || 'Translation not available'}
              </div>
            </div>
            <div class="translation-toggle" onclick="toggleTranslation()">
              <span class="toggle-label">📖 Translation</span>
              <input type="checkbox" ${showTranslation ? 'checked' : ''} />
            </div>
            <div style="text-align:center; font-size:0.9rem; color:#666; margin-bottom:8px;">
              Choose the correct kanji to fill the blank:
            </div>
            <div class="quiz-options" id="quizOptions">
        `;

        question.options.forEach((option, idx) => {
          const isCorrect = option === question.correctAnswer;
          let className = 'quiz-option';
          if (quizAnswered) {
            className += ' disabled';
            if (isCorrect) className += ' reveal-correct';
          }
          html += `
            <button class="${className}" data-idx="${idx}" data-correct="${isCorrect}" onclick="handleQuizAnswer(${idx}, ${isCorrect})">
              ${option}
            </button>
          `;
        });

        html += `
            </div>
            <div class="quiz-explanation" id="quizExplanation">
              <strong>📖 Explanation:</strong><br>
              <span id="explanationText"></span>
              <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
                <button class="speak-btn" onclick="speakFullSentence()" style="padding:6px 14px;border:none;border-radius:30px;background:#4a6a7a;color:white;font-weight:bold;cursor:pointer;font-family:inherit;font-size:0.8rem;box-shadow:0 2px 0 #2a4a5a;">
                  🔊 Full Sentence
                </button>
                <button class="speak-btn" onclick="speakReading()" style="padding:6px 14px;border:none;border-radius:30px;background:#4a6a7a;color:white;font-weight:bold;cursor:pointer;font-family:inherit;font-size:0.8rem;box-shadow:0 2px 0 #2a4a5a;">
                  🔊 Reading
                </button>
              </div>
            </div>
            <div class="quiz-nav">
              <button class="hint-btn" id="quizHintBtn" onclick="showQuizHint()" ${quizAnswered ? 'style="display:none;"' : ''}>💡 Hint</button>
              <button class="skip-btn" id="quizSkipBtn" onclick="skipQuizQuestion()" ${quizAnswered ? 'style="display:none;"' : ''}>⏭️ Skip</button>
              <button class="next-btn" id="quizNextBtn" style="${quizAnswered ? 'display:inline-block;' : 'display:none;'}" onclick="nextQuizQuestion()">Next ➜</button>
            </div>
          </div>
        `;

        gridContainer.innerHTML = html;
        updateProgress();
        updateStatusBadge();
      }

      // ============================================================
      // QUIZ TTS FUNCTIONS
      // ============================================================

      let currentQuizQuestion = null;

      function speakFullSentence() {
        const question = quizQuestions[quizCurrentIndex];
        if (!question) return;
        currentQuizQuestion = question;
        const cleanSentence = getCleanSentenceForTTS(question.originalSentence);
        speakJapanese(cleanSentence);
        messageDiv.innerHTML = `🔊 Speaking: "${cleanSentence}"`;
        setTimeout(() => {
          if (!quizAnswered && !quizCompleted) {
            messageDiv.innerHTML = `📝 Question ${quizCurrentIndex + 1}/${quizQuestions.length}`;
          }
        }, 3000);
      }

      function speakReading() {
        const question = quizQuestions[quizCurrentIndex];
        if (!question) return;
        currentQuizQuestion = question;
        const reading = question.readingFull || question.reading || '';
        if (!reading) {
          messageDiv.innerHTML = '⚠️ No reading available.';
          return;
        }
        speakJapanese(reading);
        messageDiv.innerHTML = `🔊 Reading: "${reading}"`;
        setTimeout(() => {
          if (!quizAnswered && !quizCompleted) {
            messageDiv.innerHTML = `📝 Question ${quizCurrentIndex + 1}/${quizQuestions.length}`;
          }
        }, 3000);
      }

      // ============================================================
      // QUIZ ANSWER HANDLERS
      // ============================================================

      function handleQuizAnswer(idx, isCorrect) {
        if (quizAnswered) return;
        quizAnswered = true;
        quizAnsweredSet.add(quizCurrentIndex);

        const options = document.querySelectorAll('.quiz-option');
        options.forEach((opt, i) => {
          opt.classList.add('disabled');
          if (i === idx) {
            if (isCorrect) {
              opt.classList.add('correct');
            } else {
              opt.classList.add('wrong');
            }
          }
          if (opt.dataset.correct === 'true') {
            opt.classList.add('reveal-correct');
          }
        });

        const question = quizQuestions[quizCurrentIndex];
        if (isCorrect) {
          quizCorrectCount++;
          quizScore++;
          messageDiv.innerHTML = `✅ Correct! "${question.kanji}" is the right kanji!`;
        } else {
          quizWrongCount++;
          messageDiv.innerHTML = `❌ Wrong! The correct answer was "${question.correctAnswer}".`;
        }

        // Show explanation with furigana
        const explanation = document.getElementById('quizExplanation');
        const text = document.getElementById('explanationText');
        if (explanation && text) {
          explanation.classList.add('visible');
          
          let explanationHtml = '';
          explanationHtml += `<strong>Kanji:</strong> ${getFuriganaForKanji(question.kanji, question.reading)} (${question.meaning})<br>`;
          explanationHtml += `<strong>Full sentence:</strong> ${displaySentenceWithFurigana(question.originalSentence)}<br>`;
          if (question.readingFull) {
            explanationHtml += `<strong>Reading:</strong> ${question.readingFull}<br>`;
          } else {
            explanationHtml += `<strong>Reading:</strong> ${question.reading || '—'}<br>`;
          }
          explanationHtml += `<strong>Meaning:</strong> ${question.english || '—'}`;
          
          text.innerHTML = explanationHtml;
        }

        // Hide Hint and Skip buttons when answered
        const hintBtn = document.getElementById('quizHintBtn');
        const skipBtn = document.getElementById('quizSkipBtn');
        if (hintBtn) hintBtn.style.display = 'none';
        if (skipBtn) skipBtn.style.display = 'none';

        // Show Next button
        const nextBtn = document.getElementById('quizNextBtn');
        if (nextBtn) {
          nextBtn.style.display = 'inline-block';
        }

        document.querySelector('.quiz-score').textContent = `⭐ ${quizCorrectCount} correct`;
        saveQuizState();
      }

      function nextQuizQuestion() {
        quizAnswered = false;
        quizCurrentIndex++;

        if (quizCurrentIndex >= quizQuestions.length) {
          quizCompleted = true;
          renderQuizComplete();
          return;
        }

        renderQuiz();
        messageDiv.innerHTML = `📝 Question ${quizCurrentIndex + 1}/${quizQuestions.length}`;
      }

      function skipQuizQuestion() {
        if (quizAnswered) return;
        quizAnswered = true;
        quizSkippedCount++;
        quizAnsweredSet.add(quizCurrentIndex);

        const question = quizQuestions[quizCurrentIndex];
        
        const options = document.querySelectorAll('.quiz-option');
        options.forEach((opt) => {
          opt.classList.add('disabled');
          if (opt.dataset.correct === 'true') {
            opt.classList.add('reveal-correct');
          }
        });

        messageDiv.innerHTML = `⏭️ Skipped! The answer was "${question.correctAnswer}".`;

        const explanation = document.getElementById('quizExplanation');
        const text = document.getElementById('explanationText');
        if (explanation && text) {
          explanation.classList.add('visible');
          
          let explanationHtml = '';
          explanationHtml += `<strong>Kanji:</strong> ${getFuriganaForKanji(question.kanji, question.reading)} (${question.meaning})<br>`;
          explanationHtml += `<strong>Full sentence:</strong> ${displaySentenceWithFurigana(question.originalSentence)}<br>`;
          if (question.readingFull) {
            explanationHtml += `<strong>Reading:</strong> ${question.readingFull}<br>`;
          } else {
            explanationHtml += `<strong>Reading:</strong> ${question.reading || '—'}<br>`;
          }
          explanationHtml += `<strong>Meaning:</strong> ${question.english || '—'}`;
          
          text.innerHTML = explanationHtml;
        }

        // Hide Hint and Skip buttons when skipped
        const hintBtn = document.getElementById('quizHintBtn');
        const skipBtn = document.getElementById('quizSkipBtn');
        if (hintBtn) hintBtn.style.display = 'none';
        if (skipBtn) skipBtn.style.display = 'none';

        // Show Next button
        const nextBtn = document.getElementById('quizNextBtn');
        if (nextBtn) {
          nextBtn.style.display = 'inline-block';
        }

        saveQuizState();
      }

      function showQuizHint() {
        if (quizAnswered) return;
        const question = quizQuestions[quizCurrentIndex];
        messageDiv.innerHTML = `💡 Hint: ${question.hint}`;
        setTimeout(() => {
          if (!quizAnswered) {
            messageDiv.innerHTML = `📝 Question ${quizCurrentIndex + 1}/${quizQuestions.length}`;
          }
        }, 3000);
      }

      function renderQuizComplete() {
        const total = quizQuestions.length;
        const answered = quizAnsweredSet.size;
        const percentage = total > 0 ? Math.round((quizCorrectCount / total) * 100) : 0;

        let message = '';
        if (percentage >= 90) message = '🏆 日本語マスター！ Amazing! You\'re a kanji master!';
        else if (percentage >= 70) message = '🌟 Great job! You really know your N5 kanji!';
        else if (percentage >= 50) message = '📚 Good effort! Keep practicing!';
        else message = '💪 Keep going! Review the kanji and try again!';

        gridContainer.innerHTML = `
          <div class="quiz-complete">
            <div style="font-size:3rem;">🎉</div>
            <h2>Quiz Complete!</h2>
            <div class="final-score">${quizCorrectCount}/${total}</div>
            <div style="font-size:1.2rem; margin:8px 0;">${percentage}% correct</div>
            <div style="margin:12px 0; font-size:1rem; color:#4a6a4a;">${message}</div>
            <div class="stats-grid">
              <div class="stat-item">
                <div class="label">✅ Correct</div>
                <div class="value">${quizCorrectCount}</div>
              </div>
              <div class="stat-item">
                <div class="label">❌ Wrong</div>
                <div class="value">${quizWrongCount}</div>
              </div>
              <div class="stat-item">
                <div class="label">⏭️ Skipped</div>
                <div class="value">${quizSkippedCount}</div>
              </div>
              <div class="stat-item">
                <div class="label">📊 Answered</div>
                <div class="value">${answered}/${total}</div>
              </div>
            </div>
            <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:16px;">
              <button onclick="startQuiz()" style="padding:12px 30px;border:none;border-radius:50px;background:#4a7a4a;color:white;font-weight:bold;cursor:pointer;box-shadow:0 4px 0 #2a5a2a;font-family:inherit;">
                🔄 Retry Quiz
              </button>
              <button onclick="toggleQuizMode()" style="padding:12px 30px;border:none;border-radius:50px;background:#8a6a3a;color:white;font-weight:bold;cursor:pointer;box-shadow:0 4px 0 #5a4a2a;font-family:inherit;">
                🎯 Back to Match
              </button>
            </div>
          </div>
        `;
      }

      function startQuiz() {
        quizQuestions = generateQuizQuestions();
        quizCurrentIndex = 0;
        quizScore = 0;
        quizCorrectCount = 0;
        quizWrongCount = 0;
        quizSkippedCount = 0;
        quizAnswered = false;
        quizCompleted = false;
        quizAnsweredSet = new Set();
        renderQuiz();
        messageDiv.innerHTML = `📝 Quiz started! ${quizQuestions.length} questions`;
        saveQuizState();
      }

      function saveQuizState() {
        try {
          const state = {
            questions: quizQuestions,
            currentIndex: quizCurrentIndex,
            correctCount: quizCorrectCount,
            wrongCount: quizWrongCount,
            skippedCount: quizSkippedCount,
            answeredSet: Array.from(quizAnsweredSet),
            completed: quizCompleted,
            timestamp: Date.now()
          };
          localStorage.setItem(QUIZ_KEY, JSON.stringify(state));
        } catch (e) {
          console.warn("Failed to save quiz state:", e);
        }
      }

      function loadQuizState() {
        try {
          const saved = localStorage.getItem(QUIZ_KEY);
          if (!saved) return false;
          const state = JSON.parse(saved);
          
          if (state.questions && state.questions.length > 0) {
            quizQuestions = state.questions;
            quizCurrentIndex = state.currentIndex || 0;
            quizCorrectCount = state.correctCount || 0;
            quizWrongCount = state.wrongCount || 0;
            quizSkippedCount = state.skippedCount || 0;
            quizAnsweredSet = new Set(state.answeredSet || []);
            quizCompleted = state.completed || false;
            return true;
          }
          return false;
        } catch (e) {
          return false;
        }
      }

      // ============================================================
      // TOGGLE QUIZ MODE
      // ============================================================

      function toggleQuizMode() {
        isQuizMode = !isQuizMode;
        
        if (isQuizMode) {
          quizBtn.classList.add('active');
          quizBtn.textContent = '🎌 Match';
          
          primeSpeech();
          
          // Load translation preference
          loadTranslationPreference();
          
          if (!loadQuizState() || quizQuestions.length === 0) {
            quizQuestions = generateQuizQuestions();
            quizCurrentIndex = 0;
            quizCorrectCount = 0;
            quizWrongCount = 0;
            quizSkippedCount = 0;
            quizAnswered = false;
            quizCompleted = false;
            quizAnsweredSet = new Set();
          }
          
          if (quizCompleted || quizCurrentIndex >= quizQuestions.length) {
            quizCompleted = true;
            renderQuizComplete();
          } else {
            renderQuiz();
            messageDiv.innerHTML = `📝 Quiz Mode - Question ${quizCurrentIndex + 1}/${quizQuestions.length}`;
          }
          
          statusBadge.textContent = '📝 Quiz Mode';
          statusBadge.className = 'status-badge quiz-badge';
          
          document.querySelector('.penalty-box').style.display = 'none';
          document.querySelector('.set-box').style.display = 'none';
          
          if (!isPaused) {
            lockBoard = true;
          }
          
          saveGameState();
        } else {
          quizBtn.classList.remove('active');
          quizBtn.textContent = '📝 Quiz';
          
          statusBadge.textContent = '▶️ Active';
          statusBadge.className = 'status-badge';
          
          document.querySelector('.penalty-box').style.display = 'flex';
          document.querySelector('.set-box').style.display = 'flex';
          
          if (!isPaused) {
            lockBoard = false;
          }
          
          if (activeDeck.length === 0) {
            buildActiveGame();
          } else {
            renderGrid();
            updateUI();
            updateProgress();
            updateStatusBadge();
          }
          
          messageDiv.innerHTML = '🎯 Back to Matching Mode!';
        }
      }

      // ============================================================
      // CORE GAME FUNCTIONS
      // ============================================================

      function uid() {
        return Date.now() + "-" + Math.random() + "-" + performance.now();
      }

      function generateSetsFromData() {
        const pairsPerSet = parseInt(pairsPerSetSelect.value) || 6;
        const shuffled = shuffleArray([...N5_MATCHING_DATA]);
        const sets = [];

        for (let i = 0; i < shuffled.length; i += pairsPerSet) {
          const set = shuffled.slice(i, i + pairsPerSet);
          if (set.length > 0) {
            sets.push(set);
          }
        }

        return sets;
      }

      let MASTER_SETS = [];

      function rebuildMasterSets() {
        MASTER_SETS = generateSetsFromData();
        totalSets = MASTER_SETS.length;
        totalSetsSpan.innerText = totalSets;
      }

      function buildDeckFromPairs(pairsList) {
        const deck = [];
        pairsList.forEach((pair, idx) => {
          const pairKey = pair.id !== undefined ? pair.id : idx;

          if (!pair.kanji || !pair.hiragana) {
            console.warn("Skipping invalid pair:", pair);
            return;
          }

          deck.push({
            id: uid(),
            type: "kanji",
            displayValue: pair.kanji,
            matchId: pairKey,
            pairRef: pair,
            matched: false,
          });
          deck.push({
            id: uid(),
            type: "kana",
            displayValue: pair.hiragana,
            matchId: pairKey,
            pairRef: pair,
            matched: false,
          });
        });
        return shuffleArray(deck);
      }

      function buildActiveGame() {
        let freshPairs = [];
        if (currentOriginalSetIndex < MASTER_SETS.length) {
          freshPairs = MASTER_SETS[currentOriginalSetIndex];
        }

        const allPairs = [...freshPairs, ...carryoverPairs];

        const uniqueMap = new Map();
        for (const pair of allPairs) {
          const key = pair.id || pair.kanji + "_" + pair.hiragana;
          if (!uniqueMap.has(key)) {
            uniqueMap.set(key, pair);
          }
        }
        const finalPairs = Array.from(uniqueMap.values());

        if (
          finalPairs.length === 0 &&
          currentOriginalSetIndex >= MASTER_SETS.length &&
          carryoverPairs.length === 0
        ) {
          gameCompleted = true;
          messageDiv.innerHTML =
            "🏆 PERFECT MEMORY! You mastered all " +
            N5_MATCHING_DATA.length +
            " N5 Kanji! 🏆";
          gridContainer.innerHTML = `
            <div class="game-complete">
                🎉 全問制覇 🎉
                <br><br>
                You matched all ${N5_MATCHING_DATA.length} kanji!
                <br><br>
                <button onclick="fullGameReset()" style="padding:10px 24px;border:none;border-radius:50px;background:#746139;color:white;font-weight:bold;cursor:pointer;box-shadow:0 4px 0 #47381f;">🔁 Play Again</button>
            </div>
        `;
          updateProgress();
          return false;
        }

        const newDeck = buildDeckFromPairs(finalPairs);
        activeDeck = newDeck;
        selectedCardIndex = null;
        lockBoard = false;
        currentlyMatchedCount =
          activeDeck.filter((c) => c.matched === true).length / 2;
        totalPairsInActiveDeck = finalPairs.length;
        isWaitingForNext = false;

        renderGrid();
        updateUI();
        updateProgress();
        updateStatusBadge();

        const carryCount = carryoverPairs.length;
        if (carryCount > 0) {
          messageDiv.innerHTML = `⚠️ ${carryCount} mistaken pair(s) follow you! Match them to proceed. ⚠️`;
        } else {
          const setNum = Math.min(
            currentOriginalSetIndex + 1,
            MASTER_SETS.length,
          );
          messageDiv.innerHTML = `🎴 Set ${setNum}/${MASTER_SETS.length} + ${carryCount} review pairs. Match Kanji ↔ Hiragana.`;
        }
        return true;
      }

      // ============================================================
      // SHOW SET COMPLETE WITH NEXT BUTTON
      // ============================================================

      function showSetComplete() {
        const allMatched =
          activeDeck.length > 0 &&
          activeDeck.every((card) => card.matched === true);
        if (!allMatched || gameCompleted || isWaitingForNext) return;

        isWaitingForNext = true;
        lockBoard = true;

        const carryCount = carryoverPairs.length;
        const setNum = Math.min(
          currentOriginalSetIndex + 1,
          MASTER_SETS.length,
        );

        let message;
        let buttonClass = "next-set-btn";
        let buttonText = "▶ Next Set";

        if (carryCount > 0) {
          message = `✅ All matched! ${carryCount} mistake(s) still need review.`;
          buttonText = `📚 Review ${carryCount} Mistake(s)`;
          buttonClass = "next-set-btn review";
        } else {
          message = `🎉 Perfect! Set ${setNum}/${MASTER_SETS.length} complete!`;
          buttonText = "▶ Next Set";
        }

        messageDiv.innerHTML = message;
        messageDiv.style.background = carryCount > 0 ? "#f5e6c8" : "#c8e6c9";
        messageDiv.style.border =
          carryCount > 0 ? "3px solid #c47d44" : "3px solid #4caf50";

        const btnContainer = document.createElement("div");
        btnContainer.className = "next-set-container";
        btnContainer.innerHTML = `
          <button class="${buttonClass}" onclick="advanceToNextSet()">
            ${buttonText}
          </button>
        `;
        gridContainer.appendChild(btnContainer);

        document.querySelectorAll(".card:not(.matched)").forEach((c) => {
          c.style.cursor = "default";
          c.style.pointerEvents = "none";
        });

        saveGameState();
        updateStatusBadge();
      }

      // ============================================================
      // ADVANCE TO NEXT SET
      // ============================================================

      function advanceToNextSet() {
        const btnContainer = document.querySelector(".next-set-container");
        if (btnContainer) btnContainer.remove();

        messageDiv.style.background = "";
        messageDiv.style.border = "";

        isWaitingForNext = false;
        lockBoard = false;

        if (carryoverPairs.length === 0) {
          if (currentOriginalSetIndex < MASTER_SETS.length - 1) {
            currentOriginalSetIndex++;
            const success = buildActiveGame();
            if (success !== false) {
              updateUI();
              saveGameState();
            }
          } else {
            gameCompleted = true;
            messageDiv.innerHTML =
              "🌟 PERFECT! You've conquered all N5 Kanji! 🌟";
            gridContainer.innerHTML = `
              <div class="game-complete">
                  🏅 日本一の記憶力！ 🏅
                  <br><br>
                  You matched all ${N5_MATCHING_DATA.length} N5 kanji!
                  <br><br>
                  <button onclick="fullGameReset()" style="padding:10px 24px;border:none;border-radius:50px;background:#746139;color:white;font-weight:bold;cursor:pointer;box-shadow:0 4px 0 #47381f;">🔁 Play Again</button>
              </div>
            `;
            updateProgress();
            clearSave();
            return;
          }
        } else {
          const success = buildActiveGame();
          if (success !== false) updateUI();
        }

        renderGrid();
        updateProgress();
        updateStatusBadge();
        saveGameState();
      }

      // ============================================================
      // ORIGINAL checkCompletionAndAdvance
      // ============================================================

      function checkCompletionAndAdvance() {
        const allMatched =
          activeDeck.length > 0 &&
          activeDeck.every((card) => card.matched === true);
        if (allMatched && !gameCompleted && activeDeck.length > 0) {
          showSetComplete();
          return;
        }
      }

      // ============================================================
      // CARD CLICK HANDLER
      // ============================================================

      function onCardClick(clickedIdx) {
        if (lockBoard || gameCompleted || isPaused || isWaitingForNext || isQuizMode) return;
        const clickedCard = activeDeck[clickedIdx];
        if (clickedCard.matched) return;

        if (selectedCardIndex === null) {
          selectedCardIndex = clickedIdx;
          renderGrid();
          return;
        }

        if (selectedCardIndex === clickedIdx) {
          selectedCardIndex = null;
          renderGrid();
          return;
        }

        const selectedCard = activeDeck[selectedCardIndex];
        const cardA = selectedCard;
        const cardB = clickedCard;

        let isMatch =
          cardA.matchId === cardB.matchId && cardA.type !== cardB.type;

        if (isMatch) {
          cardA.matched = true;
          cardB.matched = true;
          totalScore++;
          currentlyMatchedCount++;
          updateUI();
          selectedCardIndex = null;
          renderGrid();

          const pairRef = cardA.pairRef || cardB.pairRef;
          if (pairRef && pairRef.meaning) {
            messageDiv.innerHTML = `✔️ Correct! ${cardA.displayValue} = ${cardB.displayValue} (${pairRef.meaning})`;
          } else {
            messageDiv.innerHTML = "✔️ Correct! Great job!";
          }

          saveGameState();

          const allNowMatched = activeDeck.every((c) => c.matched === true);
          if (allNowMatched) {
            setTimeout(() => {
              checkCompletionAndAdvance();
              updateProgress();
            }, 600);
          }
          updateProgress();
        } else {
          const mismatchedPairId = cardA.matchId;
          let wrongPair = cardA.pairRef || cardB.pairRef;
          if (
            wrongPair &&
            !carryoverPairs.some(
              (p) => (p.id || p.kanji) === (wrongPair.id || wrongPair.kanji),
            )
          ) {
            carryoverPairs.push({
              id: wrongPair.id || wrongPair.kanji + "_" + Date.now(),
              kanji: wrongPair.kanji,
              hiragana: wrongPair.hiragana,
              meaning: wrongPair.meaning || "",
              readingType: wrongPair.readingType || "",
              alternativeReadings: wrongPair.alternativeReadings || [],
            });
            updateUI();
            messageDiv.innerHTML = `❌ Mismatch! "${cardA.displayValue}" ≠ "${cardB.displayValue}". This pair will reappear! ❌`;
            saveGameState();
          } else {
            messageDiv.innerHTML = `❌ Wrong combination. Keep trying!`;
          }

          lockBoard = true;
          renderGrid();

          const tiles = document.querySelectorAll(".card");
          if (tiles[selectedCardIndex] && tiles[clickedIdx]) {
            tiles[selectedCardIndex].style.backgroundColor = "#ffb4a2";
            tiles[clickedIdx].style.backgroundColor = "#ffb4a2";
            setTimeout(() => {
              if (tiles[selectedCardIndex])
                tiles[selectedCardIndex].style.backgroundColor = "";
              if (tiles[clickedIdx])
                tiles[clickedIdx].style.backgroundColor = "";
            }, 500);
          }

          setTimeout(() => {
            selectedCardIndex = null;
            renderGrid();
            lockBoard = false;
          }, 700);
        }
      }

      function renderGrid() {
        if (isQuizMode) return;
        
        gridContainer.innerHTML = "";
        for (let i = 0; i < activeDeck.length; i++) {
          const card = activeDeck[i];
          const tile = document.createElement("div");
          tile.className = "card";
          if (card.matched) tile.classList.add("matched");
          if (selectedCardIndex === i && !card.matched)
            tile.classList.add("selected");
          tile.setAttribute("data-type", card.type);
          tile.innerText = card.displayValue;
          if (
            !card.matched &&
            !lockBoard &&
            !gameCompleted &&
            !isPaused &&
            !isWaitingForNext
          ) {
            tile.style.cursor = "pointer";
          } else {
            tile.style.cursor = "default";
          }
          tile.addEventListener("click", (e) => {
            e.stopPropagation();
            if (
              lockBoard ||
              gameCompleted ||
              isPaused ||
              card.matched ||
              isWaitingForNext ||
              isQuizMode
            )
              return;
            onCardClick(i);
          });
          gridContainer.appendChild(tile);
        }
      }

      function updateUI() {
        scoreSpan.innerText = totalScore;
        const setDisplay = Math.min(
          currentOriginalSetIndex + 1,
          MASTER_SETS.length,
        );
        setCounterSpan.innerText = setDisplay;
        totalSetsSpan.innerText = MASTER_SETS.length;
        carrySpan.innerText = carryoverPairs.length;
        updateProgress();
      }

      function updateProgress() {
        const totalKanji = N5_MATCHING_DATA.length;
        const matched = totalScore;
        const progress = Math.min((matched / totalKanji) * 100, 100);
        progressFill.style.width = progress + "%";
      }

      function updateStatusBadge() {
        if (isQuizMode) {
          statusBadge.textContent = '📝 Quiz Mode';
          statusBadge.className = 'status-badge quiz-badge';
          return;
        }
        
        if (gameCompleted) {
          statusBadge.textContent = "🏆 Complete";
          statusBadge.className = "status-badge";
        } else if (isPaused) {
          statusBadge.textContent = "⏸️ Paused";
          statusBadge.className = "status-badge paused-badge";
        } else if (isWaitingForNext) {
          statusBadge.textContent = "✅ Set Done";
          statusBadge.className = "status-badge";
        } else {
          statusBadge.textContent = "▶️ Active";
          statusBadge.className = "status-badge";
        }
      }

      // ============================================================
      // PAUSE FUNCTIONALITY
      // ============================================================

      function togglePause() {
        if (gameCompleted || isQuizMode) return;

        isPaused = !isPaused;

        if (isPaused) {
          lockBoard = true;
          pauseBtn.textContent = "▶️ Resume";
          messageDiv.innerHTML =
            "⏸️ Game Paused - Progress auto-saved! Click Resume to continue.";
          gridContainer.classList.add("paused");
          document
            .querySelectorAll(".card")
            .forEach((c) => (c.style.cursor = "default"));
          updateStatusBadge();
          saveGameState();
        } else {
          lockBoard = false;
          pauseBtn.textContent = "⏸️ Pause";
          messageDiv.innerHTML = "▶️ Resumed! Keep matching!";
          gridContainer.classList.remove("paused");
          renderGrid();
          updateStatusBadge();
          if (activeDeck.length === 0) {
            buildActiveGame();
          }
        }
      }

      // ============================================================
      // SAVE & EXIT
      // ============================================================

      function saveAndExit() {
        if (gameCompleted) {
          messageDiv.innerHTML = "🏆 Game already completed! Start a new game.";
          return;
        }

        if (activeDeck.length === 0) {
          messageDiv.innerHTML = "No game in progress to save.";
          return;
        }

        if (
          !confirm(
            "💾 Save progress and exit?\n\nYou can resume later from the main menu.",
          )
        ) {
          return;
        }

        saveGameState();

        const total = N5_MATCHING_DATA.length;
        const progress = Math.round((totalScore / total) * 100);

        gridContainer.innerHTML = `
        <div class="save-screen">
            <div style="font-size:3rem;">💾</div>
            <h2>Game Saved!</h2>
            <div class="progress-text">Progress: ${totalScore}/${total} kanji (${progress}%)</div>
            <div class="sub-text">${carryoverPairs.length} pairs still need matching</div>
            <div class="sub-text" style="font-size:0.8rem; color:#999;">
                Last saved: ${new Date().toLocaleString()}
            </div>
            <div class="btn-group">
                <button class="btn-resume" onclick="resumeFromSave()">▶️ Resume</button>
                <button class="btn-newgame" onclick="fullGameReset()">🔄 New Game</button>
            </div>
        </div>
    `;

        lockBoard = true;
        pauseBtn.disabled = true;
        document.querySelector(".grid").classList.add("paused");
        updateStatusBadge();
        messageDiv.innerHTML =
          "💾 Game saved successfully! You can close the tab safely.";
      }

      function resumeFromSave() {
        const saved = loadGameState();
        if (!saved) {
          messageDiv.innerHTML = "No saved game found. Starting fresh.";
          fullGameReset();
          return;
        }

        currentOriginalSetIndex = saved.currentOriginalSetIndex || 0;
        carryoverPairs = saved.carryoverPairs || [];
        totalScore = saved.totalScore || 0;
        gameCompleted = false;
        isPaused = false;
        lockBoard = false;
        pauseBtn.disabled = false;
        pauseBtn.textContent = "⏸️ Pause";

        if (saved.activeDeckState && saved.activeDeckState.length > 0) {
          activeDeck = saved.activeDeckState.map((card) => ({
            ...card,
            pairRef: card.pairRef
              ? {
                  ...card.pairRef,
                  id: card.pairRef.id || card.matchId,
                }
              : null,
          }));
          selectedCardIndex = saved.selectedCardIndex || null;
          currentlyMatchedCount = saved.currentlyMatchedCount || 0;
          totalPairsInActiveDeck =
            saved.totalPairsInActiveDeck || activeDeck.length / 2;
        } else {
          const success = buildActiveGame();
          if (!success) {
            fullGameReset();
            return;
          }
        }

        renderGrid();
        updateUI();
        updateProgress();
        updateStatusBadge();
        document.querySelector(".grid").classList.remove("paused");
        gridContainer.querySelector(".save-screen")?.remove();

        const total = N5_MATCHING_DATA.length;
        messageDiv.innerHTML = `📂 Resumed! ${totalScore}/${total} kanji matched (${Math.round((totalScore / total) * 100)}%). Carryover: ${carryoverPairs.length}`;
      }

      // ============================================================
      // RESET
      // ============================================================

      function fullGameReset() {
        if (activeDeck.length > 0 && totalScore > 0) {
          if (
            !confirm(
              "🔄 Start a new game?\n\nYour current progress will be lost.",
            )
          ) {
            return;
          }
        }

        clearSave();
        currentOriginalSetIndex = 0;
        carryoverPairs = [];
        totalScore = 0;
        selectedCardIndex = null;
        lockBoard = false;
        gameCompleted = false;
        isPaused = false;
        isWaitingForNext = false;
        pauseBtn.disabled = false;
        pauseBtn.textContent = "⏸️ Pause";
        document.querySelector(".grid").classList.remove("paused");
        messageDiv.style.background = "";
        messageDiv.style.border = "";

        rebuildMasterSets();
        const success = buildActiveGame();
        if (success !== false) {
          updateUI();
          updateStatusBadge();
          messageDiv.innerHTML =
            "🔄 New game! Wrong picks will haunt you — match them wisely!";
        }
      }

      // ============================================================
      // STATS
      // ============================================================

      function showStats() {
        if (isQuizMode) {
          const total = quizQuestions.length;
          const answered = quizAnsweredSet.size;
          const percentage = total > 0 ? Math.round((quizCorrectCount / total) * 100) : 0;
          alert(
            `📊 Quiz Stats\n\n` +
            `Total Questions: ${total}\n` +
            `✅ Correct: ${quizCorrectCount}\n` +
            `❌ Wrong: ${quizWrongCount}\n` +
            `⏭️ Skipped: ${quizSkippedCount}\n` +
            `📊 Answered: ${answered}/${total}\n` +
            `🏆 Score: ${percentage}%`
          );
          return;
        }

        const total = N5_MATCHING_DATA.length;
        const matched = totalScore;
        const remaining = total - matched;
        const carryCount = carryoverPairs.length;
        const setsCompleted = Math.min(
          currentOriginalSetIndex,
          MASTER_SETS.length,
        );
        const totalSetsCount = MASTER_SETS.length;
        const progress = Math.round((matched / total) * 100);

        let msg = `📊 Game Stats\n\n`;
        msg += `Total N5 Kanji: ${total}\n`;
        msg += `Matched: ${matched}\n`;
        msg += `Remaining: ${remaining}\n`;
        msg += `Progress: ${progress}%\n`;
        msg += `Carryover pairs: ${carryCount}\n`;
        msg += `Sets completed: ${setsCompleted}/${totalSetsCount}\n`;
        msg += `Current deck: ${activeDeck.filter((c) => !c.matched).length} cards left\n`;
        msg += `Status: ${gameCompleted ? "🏆 COMPLETE!" : isPaused ? "⏸️ Paused" : "▶️ Active"}\n`;

        if (carryCount > 0) {
          msg += `\n⚠️ ${carryCount} pair(s) following you:\n`;
          carryoverPairs.slice(0, 5).forEach((p, i) => {
            msg += `  ${i + 1}. ${p.kanji} (${p.hiragana})${p.meaning ? " - " + p.meaning : ""}\n`;
          });
          if (carryCount > 5) msg += `  ... and ${carryCount - 5} more\n`;
        }

        alert(msg);
      }

      // ============================================================
      // OPEN KATAKANA APP
      // ============================================================

      function openKatakanaApp() {
        saveGameState();
        window.open("K7-Katakana.html", "_blank");
      }

      // ============================================================
      // AUTO-SAVE TIMER
      // ============================================================

      function startAutoSaveTimer() {
        if (saveTimer) clearInterval(saveTimer);
        saveTimer = setInterval(() => {
          if (
            !isPaused &&
            !gameCompleted &&
            activeDeck.length > 0 &&
            autoSaveEnabled
          ) {
            saveGameState();
            const indicator = document.getElementById("autoSaveIndicator");
            if (indicator) {
              indicator.textContent = "💾 Saving...";
              setTimeout(() => {
                indicator.textContent = "💾 Auto-save";
              }, 500);
            }
          }
        }, 30000);
      }

      // ============================================================
      // INITIALIZATION
      // ============================================================

      function initGame() {
        const settings = loadSettings();
        
        pairsPerSetSelect.addEventListener("change", () => {
          saveSettings();
          if (
            activeDeck.length === 0 ||
            (totalScore === 0 && carryoverPairs.length === 0)
          ) {
            rebuildMasterSets();
            fullGameReset();
          } else {
            messageDiv.innerHTML =
              "ℹ️ Settings changed. Start a new game to apply.";
          }
        });

        autoSaveToggle.addEventListener("change", () => {
          saveSettings();
          autoSaveEnabled = autoSaveToggle.checked;
          messageDiv.innerHTML = autoSaveEnabled
            ? "💾 Auto-save enabled"
            : "💾 Auto-save disabled";
          setTimeout(() => {
            if (!gameCompleted) updateStatusBadge();
          }, 1500);
        });

        quizBtn.addEventListener("click", toggleQuizMode);

        rebuildMasterSets();

        document.addEventListener('click', () => {
          if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
          }
        }, { once: true });

        const saved = loadGameState();
        if (saved && saved.totalScore > 0 && !saved.gameCompleted) {
          const total = N5_MATCHING_DATA.length;
          const progress = Math.round((saved.totalScore / total) * 100);
          const confirmResume = confirm(
            `📚 Found a saved game!\n\n` +
              `Progress: ${saved.totalScore}/${total} kanji (${progress}%)\n` +
              `Sets remaining: ${MASTER_SETS.length - saved.currentOriginalSetIndex}\n` +
              `Carryover: ${saved.carryoverPairs?.length || 0} pairs\n\n` +
              `Click OK to resume, Cancel to start fresh.`,
          );
          if (confirmResume) {
            resumeFromSave();
            return;
          } else {
            clearSave();
          }
        }

        fullGameReset();
        startAutoSaveTimer();

        window.addEventListener("beforeunload", () => {
          if (autoSaveEnabled && !gameCompleted && activeDeck.length > 0) {
            saveGameState();
          }
          if (isQuizMode) {
            saveQuizState();
          }
        });
      }

      // ============================================================
      // EVENT BINDINGS
      // ============================================================

      pauseBtn.addEventListener("click", togglePause);
      saveBtn.addEventListener("click", saveAndExit);
      resetBtn.addEventListener("click", fullGameReset);
      showStatsBtn.addEventListener("click", showStats);
      document
        .getElementById("katakanaBtn")
        .addEventListener("click", openKatakanaApp);

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" || e.key === "p") {
          e.preventDefault();
          if (isQuizMode) {
            toggleQuizMode();
          } else {
            togglePause();
          }
        }
        if (e.key === "s" && e.ctrlKey) {
          e.preventDefault();
          saveAndExit();
        }
        if (e.key === "Enter" && isWaitingForNext) {
          e.preventDefault();
          advanceToNextSet();
        }
        if (e.key === "q" || e.key === "Q") {
          e.preventDefault();
          toggleQuizMode();
        }
        if (e.key === "t" || e.key === "T") {
          e.preventDefault();
          toggleTranslation();
        }
        if (isQuizMode && !quizAnswered && !quizCompleted) {
          if (e.key >= '1' && e.key <= '4') {
            const idx = parseInt(e.key) - 1;
            const options = document.querySelectorAll('.quiz-option');
            if (options[idx] && !options[idx].classList.contains('disabled')) {
              options[idx].click();
            }
          }
          if (e.key === "h" || e.key === "H") {
            showQuizHint();
          }
        }
      });

      console.log(
        "🎮 Kanji Master loaded with " + N5_MATCHING_DATA.length + " N5 kanji!",
      );
      console.log("📚 Total sets: " + MASTER_SETS.length);
      console.log(
        "⌨️ Keyboard shortcuts: ESC/P = Pause, Ctrl+S = Save, Enter = Next Set, Q = Quiz Mode, T = Translation Toggle",
      );
      console.log("📝 Quiz Mode: 1-4 = Select answer, H = Hint");

      if (window.speechSynthesis) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => {
          window.speechSynthesis.getVoices();
        };
      }

      initGame();
    </script>
  </body>
</html>
