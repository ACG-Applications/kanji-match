    <title>Kanji Master: Persistent Memory | N5 漢字·ひらがな</title>
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        background: linear-gradient(145deg, #0f2b2c 0%, #07161a 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family:
          "Segoe UI", "Noto Sans JP", "Yu Gothic", "Hiragino Sans", "Meiryo",
          system-ui, sans-serif;
        margin: 0;
        padding: 20px;
      }

      .game-container {
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(5px);
        border-radius: 3rem 1.8rem 3rem 1.8rem;
        padding: 1.2rem;
        box-shadow: 0 25px 40px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 950px;
      }

      .game-panel {
        background: #fff7ec;
        background-image: radial-gradient(
          circle at 20% 40%,
          rgba(210, 180, 140, 0.1) 2%,
          transparent 2.5%
        );
        background-size: 28px 28px;
        border-radius: 2rem;
        padding: 1.2rem 1rem 1.8rem;
        box-shadow:
          inset 0 1px 5px rgba(85, 55, 25, 0.1),
          0 12px 25px rgba(0, 0, 0, 0.3);
      }

      .stats {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
        background: #2d3e2a;
        padding: 10px 24px;
        border-radius: 60px;
        color: #faefcf;
        font-weight: bold;
      }

      .score-box,
      .set-box,
      .penalty-box {
        background: #1a2c18;
        padding: 5px 18px;
        border-radius: 50px;
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-size: 0.9rem;
      }

      .score-box strong,
      .set-box strong,
      .penalty-box strong {
        font-size: 1.5rem;
        font-weight: 800;
        color: #ffec9f;
        font-family: monospace;
        margin-left: 5px;
      }

      .message-area {
        text-align: center;
        font-size: 0.95rem;
        font-weight: bold;
        background: #e8dccc;
        margin: 8px 0 20px;
        padding: 8px 12px;
        border-radius: 40px;
        color: #2f2a1f;
        transition: 0.2s;
        box-shadow:
          inset 0 1px 3px #ba9f73,
          0 2px 6px rgba(0, 0, 0, 0.1);
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px 12px;
        justify-items: center;
        align-items: center;
        margin: 10px 0 20px;
        transition: opacity 0.3s ease;
      }

      .grid.paused {
        opacity: 0.5;
        pointer-events: none;
      }

      .card {
        background: #fffbf2;
        width: 100%;
        aspect-ratio: 1 / 1;
        max-width: 115px;
        border-radius: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.18s ease;
        box-shadow: 0 8px 0 #836e48;
        border: 2px solid #ebdbbd;
        color: #2e2419;
        transform: translateY(-2px);
        font-family: "Noto Sans JP", "KaiTi", cursive;
        position: relative;
      }

      .card.matched {
        background: #8aae89;
        border-color: #3f6a3a;
        box-shadow: 0 3px 0 #2b5624;
        transform: translateY(4px);
        cursor: default;
        opacity: 0.75;
        text-decoration: line-through;
        text-decoration-thickness: 2px;
        text-decoration-color: #f9eec1;
        color: #2c2b1f;
      }

      .card.selected {
        background: #fddfa5;
        box-shadow: 0 3px 0 #bd7f2c;
        transform: translateY(3px);
        border: 2px solid #e0a23b;
        color: #4d3012;
      }

      .card[data-type="kana"] {
        font-family: "Noto Sans JP", "KaiTi", cursive;
        font-size: 1.6rem;
      }

      .card .meaning-badge {
        position: absolute;
        bottom: 4px;
        right: 6px;
        font-size: 0.5rem;
        background: rgba(0, 0, 0, 0.1);
        padding: 2px 6px;
        border-radius: 10px;
        opacity: 0.7;
      }

      .footer {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 5px;
        flex-wrap: wrap;
      }

      .footer button {
        background: #746139;
        border: none;
        font-size: 0.9rem;
        font-weight: bold;
        padding: 8px 16px;
        border-radius: 50px;
        color: #fef3df;
        cursor: pointer;
        transition: 0.05s linear;
        box-shadow: 0 4px 0 #47381f;
        letter-spacing: 0.5px;
        font-family: inherit;
        flex: 0 1 auto;
        min-width: 60px;
      }

      .footer button:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #47381f;
      }

      .footer button:disabled {
        opacity: 0.5;
        transform: translateY(2px);
        box-shadow: 0 2px 0 #47381f;
        cursor: not-allowed;
      }

      .footer button.pause-btn {
        background: #4a6a7a;
        box-shadow: 0 4px 0 #2a4a5a;
      }

      .footer button.save-btn {
        background: #4a7a4a;
        box-shadow: 0 4px 0 #2a5a2a;
      }

      .footer button.danger-btn {
        background: #8a4a4a;
        box-shadow: 0 4px 0 #5a2a2a;
      }

      .footer button.stats-btn {
        background: #7a6a4a;
        box-shadow: 0 4px 0 #4a3a2a;
      }

      .footer button.katakana-btn {
        background: #7a5a7a;
        box-shadow: 0 4px 0 #4a3a4a;
      }

      .footer button.katakana-btn:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #4a3a4a;
      }

      .progress-bar {
        width: 100%;
        height: 6px;
        background: #2d3e2a;
        border-radius: 10px;
        margin: 8px 0 12px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #ffec9f, #f5c842);
        border-radius: 10px;
        transition: width 0.5s ease;
        width: 0%;
      }

      .game-complete {
        grid-column: 1/-1;
        text-align: center;
        padding: 2rem;
        font-size: 1.5rem;
        background: #f0e2b6;
        border-radius: 40px;
      }

      .save-screen {
        grid-column: 1/-1;
        text-align: center;
        padding: 2rem;
        background: #e8f0d6;
        border-radius: 40px;
      }

      .save-screen h2 {
        margin: 10px 0;
        color: #2d3e2a;
      }

      .save-screen .progress-text {
        font-size: 1.2rem;
        color: #3a5a3a;
      }

      .save-screen .sub-text {
        font-size: 0.9rem;
        color: #666;
        margin: 8px 0;
      }

      .save-screen .btn-group {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 15px;
      }

      .save-screen .btn-group button {
        padding: 10px 24px;
        border: none;
        border-radius: 50px;
        font-weight: bold;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.1s ease;
      }

      .save-screen .btn-group button:active {
        transform: scale(0.96);
      }

      .btn-resume {
        background: #4a7a4a;
        color: white;
        box-shadow: 0 4px 0 #2a5a2a;
      }

      .btn-newgame {
        background: #8a6a3a;
        color: white;
        box-shadow: 0 4px 0 #5a4a2a;
      }

      .status-indicators {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      .status-badge {
        font-size: 0.7rem;
        padding: 2px 10px;
        border-radius: 20px;
        background: #1a2c18;
        color: #faefcf;
      }

      .status-badge.paused-badge {
        background: #4a6a7a;
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .settings-row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 10px;
        justify-content: center;
      }

      .settings-row select {
        background: #2d3e2a;
        color: #faefcf;
        border: none;
        padding: 6px 12px;
        border-radius: 30px;
        font-family: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }

      .settings-row label {
        color: #2d3e2a;
        font-size: 0.85rem;
        font-weight: bold;
      }

      .auto-save-indicator {
        font-size: 0.7rem;
        color: #4a7a4a;
        background: #e8f0d6;
        padding: 2px 10px;
        border-radius: 20px;
      }

      @media (max-width: 550px) {
        .grid {
          gap: 8px;
        }
        .card {
          font-size: 1.4rem;
          border-radius: 20px;
        }
        .card[data-type="kana"] {
          font-size: 1.1rem;
        }
        .score-box strong,
        .set-box strong {
          font-size: 1.2rem;
        }
        .stats {
          padding: 8px 14px;
          gap: 6px;
        }
        .score-box,
        .set-box,
        .penalty-box {
          padding: 3px 12px;
          font-size: 0.75rem;
        }
        .footer button {
          font-size: 0.75rem;
          padding: 6px 12px;
          min-width: 50px;
        }
        .settings-row {
          gap: 6px;
        }
        .settings-row select {
          font-size: 0.75rem;
          padding: 4px 10px;
        }
      }

      @media (max-width: 400px) {
        .card {
          font-size: 1.1rem;
          border-radius: 16px;
        }
        .card[data-type="kana"] {
          font-size: 0.9rem;
        }
        .stats {
          flex-direction: column;
          align-items: stretch;
          gap: 4px;
        }
        .score-box,
        .set-box,
        .penalty-box {
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="game-container">
      <div class="game-panel">
        <div class="stats">
          <div class="score-box">
            🎯 <span>Matches</span> <strong id="scoreValue">0</strong>
          </div>
          <div class="set-box">
            📚 <span>Set</span> <strong id="setCounter">1</strong> /
            <span id="totalSets">0</span>
          </div>
          <div class="penalty-box">
            ⚠️ <span>Unmatched</span> <strong id="carryCount">0</strong>
          </div>
          <div class="status-indicators">
            <span class="status-badge" id="statusBadge">▶️ Active</span>
            <span class="auto-save-indicator" id="autoSaveIndicator"
              >💾 Auto-save</span
            >
          </div>
        </div>

        <div class="settings-row">
          <label for="pairsPerSet">Pairs per set:</label>
          <select id="pairsPerSet">
            <option value="3">3 (Quick)</option>
            <option value="4">4</option>
            <option value="6" selected>6 (Default)</option>
            <option value="8">8</option>
            <option value="12">12 (Challenge)</option>
          </select>
          <label style="margin-left: 10px">
            <input type="checkbox" id="autoSaveToggle" checked /> Auto-save
          </label>
        </div>

        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="message-area" id="gameMessage">
          🔍 Match Kanji → Hiragana. Wrong picks stay in the deck!
        </div>

        <div class="grid" id="gameGrid"></div>

        <div class="footer">
          <button class="pause-btn" id="pauseBtn">⏸️ Pause</button>
          <button class="save-btn" id="saveBtn">💾 Save</button>
          <button class="stats-btn" id="showStatsBtn">📊 Stats</button>
          <button class="katakana-btn" id="katakanaBtn">📖 Katakana</button>
          <button class="danger-btn" id="resetBtn">🔄 New</button>
        </div>
      </div>
    </div>

    <!-- ============================================================
     GAME LOGIC WITH PAUSE + SAVE FEATURES
     ============================================================ -->
    <script>
      // ============================================================
      // CONSTANTS & STATE
      // ============================================================

      const SAVE_KEY = "kanjiMasterSave_v2";
      const SETTINGS_KEY = "kanjiMasterSettings";

      // Game state
      let currentOriginalSetIndex = 0;
      let carryoverPairs = [];
      let activeDeck = [];
      let selectedCardIndex = null;
      let lockBoard = false;
      let totalScore = 0;
      let currentlyMatchedCount = 0;
      let totalPairsInActiveDeck = 0;
      let gameCompleted = false;
      let totalSets = 0;

      // Pause state
      let isPaused = false;
      let saveTimer = null;
      let autoSaveEnabled = true;

      // DOM references
      const gridContainer = document.getElementById("gameGrid");
      const scoreSpan = document.getElementById("scoreValue");
      const setCounterSpan = document.getElementById("setCounter");
      const totalSetsSpan = document.getElementById("totalSets");
      const carrySpan = document.getElementById("carryCount");
      const messageDiv = document.getElementById("gameMessage");
      const progressFill = document.getElementById("progressFill");
      const statusBadge = document.getElementById("statusBadge");
      const pauseBtn = document.getElementById("pauseBtn");
      const saveBtn = document.getElementById("saveBtn");
      const resetBtn = document.getElementById("resetBtn");
      const showStatsBtn = document.getElementById("showStatsBtn");
      const pairsPerSetSelect = document.getElementById("pairsPerSet");
      const autoSaveToggle = document.getElementById("autoSaveToggle");

      // ============================================================
      // SETTINGS
      // ============================================================

      function getSettings() {
        try {
          const saved = localStorage.getItem(SETTINGS_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            return {
              pairsPerSet: parsed.pairsPerSet || 6,
              autoSave: parsed.autoSave !== undefined ? parsed.autoSave : true,
            };
          }
        } catch (e) {}
        return { pairsPerSet: 6, autoSave: true };
      }

      function saveSettings() {
        const settings = {
          pairsPerSet: parseInt(pairsPerSetSelect.value),
          autoSave: autoSaveToggle.checked,
        };
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        autoSaveEnabled = settings.autoSave;
      }

      function loadSettings() {
        const settings = getSettings();
        pairsPerSetSelect.value = settings.pairsPerSet;
        autoSaveToggle.checked = settings.autoSave;
        autoSaveEnabled = settings.autoSave;
        return settings;
      }

      // ============================================================
      // SAVE / LOAD
      // ============================================================

      function saveGameState() {
        if (!autoSaveEnabled) return;

        try {
          const state = {
            currentOriginalSetIndex: currentOriginalSetIndex,
            carryoverPairs: carryoverPairs,
            totalScore: totalScore,
            gameCompleted: gameCompleted,
            activeDeckState: activeDeck.map((card) => ({
              id: card.id,
              displayValue: card.displayValue,
              matchId: card.matchId,
              type: card.type,
              matched: card.matched,
              pairRef: card.pairRef
                ? {
                    id: card.pairRef.id,
                    kanji: card.pairRef.kanji,
                    hiragana: card.pairRef.hiragana,
                    meaning: card.pairRef.meaning || "",
                  }
                : null,
            })),
            selectedCardIndex: selectedCardIndex,
            currentlyMatchedCount: currentlyMatchedCount,
            totalPairsInActiveDeck: totalPairsInActiveDeck,
            isPaused: isPaused,
            timestamp: Date.now(),
            version: 2,
          };
          localStorage.setItem(SAVE_KEY, JSON.stringify(state));
        } catch (e) {
          console.warn("Failed to save:", e);
        }
      }

      function loadGameState() {
        try {
          const saved = localStorage.getItem(SAVE_KEY);
          if (!saved) return null;

          const state = JSON.parse(saved);
          // Version check
          if (state.version !== 2) {
            console.warn("Old save version, discarding");
            return null;
          }
          return state;
        } catch (e) {
          return null;
        }
      }

      function clearSave() {
        localStorage.removeItem(SAVE_KEY);
      }

      // ============================================================
      // CORE GAME FUNCTIONS
      // ============================================================

      function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function uid() {
        return Date.now() + "-" + Math.random() + "-" + performance.now();
      }

      function generateSetsFromData() {
        const pairsPerSet = parseInt(pairsPerSetSelect.value) || 6;
        const shuffled = shuffleArray([...N5_MATCHING_DATA]);
        const sets = [];

        for (let i = 0; i < shuffled.length; i += pairsPerSet) {
          const set = shuffled.slice(i, i + pairsPerSet);
          if (set.length > 0) {
            sets.push(set);
          }
        }

        return sets;
      }

      // MASTER_SETS - generated dynamically
      let MASTER_SETS = [];

      function rebuildMasterSets() {
        MASTER_SETS = generateSetsFromData();
        totalSets = MASTER_SETS.length;
        totalSetsSpan.innerText = totalSets;
      }

      function buildDeckFromPairs(pairsList) {
        const deck = [];
        pairsList.forEach((pair, idx) => {
          const pairKey = pair.id !== undefined ? pair.id : idx;

          if (!pair.kanji || !pair.hiragana) {
            console.warn("Skipping invalid pair:", pair);
            return;
          }

          deck.push({
            id: uid(),
            type: "kanji",
            displayValue: pair.kanji,
            matchId: pairKey,
            pairRef: pair,
            matched: false,
          });
          deck.push({
            id: uid(),
            type: "kana",
            displayValue: pair.hiragana,
            matchId: pairKey,
            pairRef: pair,
            matched: false,
          });
        });
        return shuffleArray(deck);
      }

      function buildActiveGame() {
        let freshPairs = [];
        if (currentOriginalSetIndex < MASTER_SETS.length) {
          freshPairs = MASTER_SETS[currentOriginalSetIndex];
        }

        const allPairs = [...freshPairs, ...carryoverPairs];

        const uniqueMap = new Map();
        for (const pair of allPairs) {
          const key = pair.id || pair.kanji + "_" + pair.hiragana;
          if (!uniqueMap.has(key)) {
            uniqueMap.set(key, pair);
          }
        }
        const finalPairs = Array.from(uniqueMap.values());

        if (
          finalPairs.length === 0 &&
          currentOriginalSetIndex >= MASTER_SETS.length &&
          carryoverPairs.length === 0
        ) {
          gameCompleted = true;
          messageDiv.innerHTML =
            "🏆 PERFECT MEMORY! You mastered all " +
            N5_MATCHING_DATA.length +
            " N5 Kanji! 🏆";
          gridContainer.innerHTML = `
            <div class="game-complete">
                🎉 全問制覇 🎉
                <br><br>
                You matched all ${N5_MATCHING_DATA.length} kanji!
                <br><br>
                <button onclick="fullGameReset()" style="padding:10px 24px;border:none;border-radius:50px;background:#746139;color:white;font-weight:bold;cursor:pointer;box-shadow:0 4px 0 #47381f;">🔁 Play Again</button>
            </div>
        `;
          updateProgress();
          return false;
        }

        const newDeck = buildDeckFromPairs(finalPairs);
        activeDeck = newDeck;
        selectedCardIndex = null;
        lockBoard = false;
        currentlyMatchedCount =
          activeDeck.filter((c) => c.matched === true).length / 2;
        totalPairsInActiveDeck = finalPairs.length;

        renderGrid();
        updateUI();
        updateProgress();
        updateStatusBadge();

        const carryCount = carryoverPairs.length;
        if (carryCount > 0) {
          messageDiv.innerHTML = `⚠️ ${carryCount} mistaken pair(s) follow you! Match them to proceed. ⚠️`;
        } else {
          const setNum = Math.min(
            currentOriginalSetIndex + 1,
            MASTER_SETS.length,
          );
          messageDiv.innerHTML = `🎴 Set ${setNum}/${MASTER_SETS.length} + ${carryCount} review pairs. Match Kanji ↔ Hiragana.`;
        }
        return true;
      }

      function checkCompletionAndAdvance() {
        const allMatched =
          activeDeck.length > 0 &&
          activeDeck.every((card) => card.matched === true);
        if (allMatched && !gameCompleted && activeDeck.length > 0) {
          if (carryoverPairs.length > 0) {
            messageDiv.innerHTML = `✨ Great! You cleared ${carryoverPairs.length} pending mistake(s)! ✨`;
          }
          carryoverPairs = [];

          if (currentOriginalSetIndex < MASTER_SETS.length - 1) {
            currentOriginalSetIndex++;
            const success = buildActiveGame();
            if (success !== false) {
              updateUI();
              saveGameState();
            }
          } else if (currentOriginalSetIndex === MASTER_SETS.length - 1) {
            if (carryoverPairs.length === 0) {
              gameCompleted = true;
              messageDiv.innerHTML =
                "🌟 PERFECT! You've conquered all N5 Kanji! 🌟";
              gridContainer.innerHTML = `
                    <div class="game-complete">
                        🏅 日本一の記憶力！ 🏅
                        <br><br>
                        You matched all ${N5_MATCHING_DATA.length} N5 kanji!
                        <br><br>
                        <button onclick="fullGameReset()" style="padding:10px 24px;border:none;border-radius:50px;background:#746139;color:white;font-weight:bold;cursor:pointer;box-shadow:0 4px 0 #47381f;">🔁 Play Again</button>
                    </div>
                `;
              updateProgress();
              clearSave();
              return;
            } else {
              const success = buildActiveGame();
              if (success !== false) updateUI();
            }
          } else {
            gameCompleted = true;
            messageDiv.innerHTML = "🏁 FINAL CLEAR! 🏁 Japanese master!";
            gridContainer.innerHTML = `
                <div class="game-complete">
                    🎌 完成！ 🎌
                    <br><br>
                    All ${N5_MATCHING_DATA.length} kanji mastered!
                </div>
            `;
            updateProgress();
            clearSave();
            return;
          }
          saveGameState();
          updateProgress();
        }
      }

      function onCardClick(clickedIdx) {
        if (lockBoard || gameCompleted || isPaused) return;
        const clickedCard = activeDeck[clickedIdx];
        if (clickedCard.matched) return;

        if (selectedCardIndex === null) {
          selectedCardIndex = clickedIdx;
          renderGrid();
          return;
        }

        if (selectedCardIndex === clickedIdx) {
          selectedCardIndex = null;
          renderGrid();
          return;
        }

        const selectedCard = activeDeck[selectedCardIndex];
        const cardA = selectedCard;
        const cardB = clickedCard;

        let isMatch =
          cardA.matchId === cardB.matchId && cardA.type !== cardB.type;

        if (isMatch) {
          cardA.matched = true;
          cardB.matched = true;
          totalScore++;
          currentlyMatchedCount++;
          updateUI();
          selectedCardIndex = null;
          renderGrid();

          const pairRef = cardA.pairRef || cardB.pairRef;
          if (pairRef && pairRef.meaning) {
            messageDiv.innerHTML = `✔️ Correct! ${cardA.displayValue} = ${cardB.displayValue} (${pairRef.meaning})`;
          } else {
            messageDiv.innerHTML = "✔️ Correct! Great job!";
          }

          // Auto-save after match
          saveGameState();

          const allNowMatched = activeDeck.every((c) => c.matched === true);
          if (allNowMatched) {
            lockBoard = true;
            messageDiv.innerHTML = "🎉 Set Completed! Moving forward... 🎉";
            setTimeout(() => {
              checkCompletionAndAdvance();
              lockBoard = false;
              renderGrid();
              updateProgress();
            }, 800);
          }
          updateProgress();
        } else {
          const mismatchedPairId = cardA.matchId;
          let wrongPair = cardA.pairRef || cardB.pairRef;
          if (
            wrongPair &&
            !carryoverPairs.some(
              (p) => (p.id || p.kanji) === (wrongPair.id || wrongPair.kanji),
            )
          ) {
            carryoverPairs.push({
              id: wrongPair.id || wrongPair.kanji + "_" + Date.now(),
              kanji: wrongPair.kanji,
              hiragana: wrongPair.hiragana,
              meaning: wrongPair.meaning || "",
              readingType: wrongPair.readingType || "",
              alternativeReadings: wrongPair.alternativeReadings || [],
            });
            updateUI();
            messageDiv.innerHTML = `❌ Mismatch! "${cardA.displayValue}" ≠ "${cardB.displayValue}". This pair will reappear! ❌`;
            saveGameState();
          } else {
            messageDiv.innerHTML = `❌ Wrong combination. Keep trying!`;
          }

          lockBoard = true;
          renderGrid();

          const tiles = document.querySelectorAll(".card");
          if (tiles[selectedCardIndex] && tiles[clickedIdx]) {
            tiles[selectedCardIndex].style.backgroundColor = "#ffb4a2";
            tiles[clickedIdx].style.backgroundColor = "#ffb4a2";
            setTimeout(() => {
              if (tiles[selectedCardIndex])
                tiles[selectedCardIndex].style.backgroundColor = "";
              if (tiles[clickedIdx])
                tiles[clickedIdx].style.backgroundColor = "";
            }, 500);
          }

          setTimeout(() => {
            selectedCardIndex = null;
            renderGrid();
            lockBoard = false;
          }, 700);
        }
      }

      function renderGrid() {
        gridContainer.innerHTML = "";
        for (let i = 0; i < activeDeck.length; i++) {
          const card = activeDeck[i];
          const tile = document.createElement("div");
          tile.className = "card";
          if (card.matched) tile.classList.add("matched");
          if (selectedCardIndex === i && !card.matched)
            tile.classList.add("selected");
          tile.setAttribute("data-type", card.type);
          tile.innerText = card.displayValue;
          if (!card.matched && !lockBoard && !gameCompleted && !isPaused) {
            tile.style.cursor = "pointer";
          } else {
            tile.style.cursor = "default";
          }
          tile.addEventListener("click", (e) => {
            e.stopPropagation();
            if (lockBoard || gameCompleted || isPaused || card.matched) return;
            onCardClick(i);
          });
          gridContainer.appendChild(tile);
        }
      }

      function updateUI() {
        scoreSpan.innerText = totalScore;
        const setDisplay = Math.min(
          currentOriginalSetIndex + 1,
          MASTER_SETS.length,
        );
        setCounterSpan.innerText = setDisplay;
        totalSetsSpan.innerText = MASTER_SETS.length;
        carrySpan.innerText = carryoverPairs.length;
        updateProgress();
      }

      function updateProgress() {
        const totalKanji = N5_MATCHING_DATA.length;
        const matched = totalScore;
        const progress = Math.min((matched / totalKanji) * 100, 100);
        progressFill.style.width = progress + "%";
      }

      function updateStatusBadge() {
        if (gameCompleted) {
          statusBadge.textContent = "🏆 Complete";
          statusBadge.className = "status-badge";
        } else if (isPaused) {
          statusBadge.textContent = "⏸️ Paused";
          statusBadge.className = "status-badge paused-badge";
        } else {
          statusBadge.textContent = "▶️ Active";
          statusBadge.className = "status-badge";
        }
      }

      // ============================================================
      // PAUSE FUNCTIONALITY
      // ============================================================

      function togglePause() {
        if (gameCompleted) return;

        isPaused = !isPaused;

        if (isPaused) {
          // Pause
          lockBoard = true;
          pauseBtn.textContent = "▶️ Resume";
          messageDiv.innerHTML =
            "⏸️ Game Paused - Progress auto-saved! Click Resume to continue.";
          gridContainer.classList.add("paused");
          document
            .querySelectorAll(".card")
            .forEach((c) => (c.style.cursor = "default"));
          updateStatusBadge();
          // Save on pause
          saveGameState();
        } else {
          // Resume
          lockBoard = false;
          pauseBtn.textContent = "⏸️ Pause";
          messageDiv.innerHTML = "▶️ Resumed! Keep matching!";
          gridContainer.classList.remove("paused");
          renderGrid();
          updateStatusBadge();
          // Check if any state needs updating
          if (activeDeck.length === 0) {
            buildActiveGame();
          }
        }
      }

      // ============================================================
      // SAVE & EXIT
      // ============================================================

      function saveAndExit() {
        if (gameCompleted) {
          messageDiv.innerHTML = "🏆 Game already completed! Start a new game.";
          return;
        }

        if (activeDeck.length === 0) {
          messageDiv.innerHTML = "No game in progress to save.";
          return;
        }

        if (
          !confirm(
            "💾 Save progress and exit?\n\nYou can resume later from the main menu.",
          )
        ) {
          return;
        }

        // Final save
        saveGameState();

        const total = N5_MATCHING_DATA.length;
        const progress = Math.round((totalScore / total) * 100);

        // Show save screen
        gridContainer.innerHTML = `
        <div class="save-screen">
            <div style="font-size:3rem;">💾</div>
            <h2>Game Saved!</h2>
            <div class="progress-text">Progress: ${totalScore}/${total} kanji (${progress}%)</div>
            <div class="sub-text">${carryoverPairs.length} pairs still need matching</div>
            <div class="sub-text" style="font-size:0.8rem; color:#999;">
                Last saved: ${new Date().toLocaleString()}
            </div>
            <div class="btn-group">
                <button class="btn-resume" onclick="resumeFromSave()">▶️ Resume</button>
                <button class="btn-newgame" onclick="fullGameReset()">🔄 New Game</button>
            </div>
        </div>
    `;

        lockBoard = true;
        pauseBtn.disabled = true;
        document.querySelector(".grid").classList.add("paused");
        updateStatusBadge();
        messageDiv.innerHTML =
          "💾 Game saved successfully! You can close the tab safely.";
      }

      function resumeFromSave() {
        const saved = loadGameState();
        if (!saved) {
          messageDiv.innerHTML = "No saved game found. Starting fresh.";
          fullGameReset();
          return;
        }

        // Restore state
        currentOriginalSetIndex = saved.currentOriginalSetIndex || 0;
        carryoverPairs = saved.carryoverPairs || [];
        totalScore = saved.totalScore || 0;
        gameCompleted = false;
        isPaused = false;
        lockBoard = false;
        pauseBtn.disabled = false;
        pauseBtn.textContent = "⏸️ Pause";

        // Rebuild active deck
        if (saved.activeDeckState && saved.activeDeckState.length > 0) {
          activeDeck = saved.activeDeckState.map((card) => ({
            ...card,
            pairRef: card.pairRef
              ? {
                  ...card.pairRef,
                  id: card.pairRef.id || card.matchId,
                }
              : null,
          }));
          selectedCardIndex = saved.selectedCardIndex || null;
          currentlyMatchedCount = saved.currentlyMatchedCount || 0;
          totalPairsInActiveDeck =
            saved.totalPairsInActiveDeck || activeDeck.length / 2;
        } else {
          // Fallback: rebuild from current set index
          const success = buildActiveGame();
          if (!success) {
            fullGameReset();
            return;
          }
        }

        // Update UI
        renderGrid();
        updateUI();
        updateProgress();
        updateStatusBadge();
        document.querySelector(".grid").classList.remove("paused");
        gridContainer.querySelector(".save-screen")?.remove();

        const total = N5_MATCHING_DATA.length;
        messageDiv.innerHTML = `📂 Resumed! ${totalScore}/${total} kanji matched (${Math.round((totalScore / total) * 100)}%). Carryover: ${carryoverPairs.length}`;

        // Clear save after resume (optional - comment out to keep)
        // clearSave();
      }

      // ============================================================
      // RESET
      // ============================================================

      function fullGameReset() {
        if (activeDeck.length > 0 && totalScore > 0) {
          if (
            !confirm(
              "🔄 Start a new game?\n\nYour current progress will be lost.",
            )
          ) {
            return;
          }
        }

        clearSave();
        currentOriginalSetIndex = 0;
        carryoverPairs = [];
        totalScore = 0;
        selectedCardIndex = null;
        lockBoard = false;
        gameCompleted = false;
        isPaused = false;
        pauseBtn.disabled = false;
        pauseBtn.textContent = "⏸️ Pause";
        document.querySelector(".grid").classList.remove("paused");

        rebuildMasterSets();
        const success = buildActiveGame();
        if (success !== false) {
          updateUI();
          updateStatusBadge();
          messageDiv.innerHTML =
            "🔄 New game! Wrong picks will haunt you — match them wisely!";
        }
      }

      // ============================================================
      // STATS
      // ============================================================

      function showStats() {
        const total = N5_MATCHING_DATA.length;
        const matched = totalScore;
        const remaining = total - matched;
        const carryCount = carryoverPairs.length;
        const setsCompleted = Math.min(
          currentOriginalSetIndex,
          MASTER_SETS.length,
        );
        const totalSetsCount = MASTER_SETS.length;
        const progress = Math.round((matched / total) * 100);

        let msg = `📊 Game Stats\n\n`;
        msg += `Total N5 Kanji: ${total}\n`;
        msg += `Matched: ${matched}\n`;
        msg += `Remaining: ${remaining}\n`;
        msg += `Progress: ${progress}%\n`;
        msg += `Carryover pairs: ${carryCount}\n`;
        msg += `Sets completed: ${setsCompleted}/${totalSetsCount}\n`;
        msg += `Current deck: ${activeDeck.filter((c) => !c.matched).length} cards left\n`;
        msg += `Status: ${gameCompleted ? "🏆 COMPLETE!" : isPaused ? "⏸️ Paused" : "▶️ Active"}\n`;

        if (carryCount > 0) {
          msg += `\n⚠️ ${carryCount} pair(s) following you:\n`;
          carryoverPairs.slice(0, 5).forEach((p, i) => {
            msg += `  ${i + 1}. ${p.kanji} (${p.hiragana})${p.meaning ? " - " + p.meaning : ""}\n`;
          });
          if (carryCount > 5) msg += `  ... and ${carryCount - 5} more\n`;
        }

        alert(msg);
      }

      // ============================================================
      // OPEN KATAKANA APP
      // ============================================================

      function openKatakanaApp() {
        // Save current game state before leaving
        saveGameState();
        // Open katakana app in new tab
        window.open("K7-Katakana.html", "_blank");
      }

      // ============================================================
      // AUTO-SAVE TIMER
      // ============================================================

      function startAutoSaveTimer() {
        if (saveTimer) clearInterval(saveTimer);
        saveTimer = setInterval(() => {
          if (
            !isPaused &&
            !gameCompleted &&
            activeDeck.length > 0 &&
            autoSaveEnabled
          ) {
            saveGameState();
            // Show subtle indicator
            const indicator = document.getElementById("autoSaveIndicator");
            if (indicator) {
              indicator.textContent = "💾 Saving...";
              setTimeout(() => {
                indicator.textContent = "💾 Auto-save";
              }, 500);
            }
          }
        }, 30000); // Every 30 seconds
      }

      // ============================================================
      // INITIALIZATION
      // ============================================================

      function initGame() {
        // Load settings
        const settings = loadSettings();
        pairsPerSetSelect.addEventListener("change", () => {
          saveSettings();
          // Only rebuild if not in the middle of a game
          if (
            activeDeck.length === 0 ||
            (totalScore === 0 && carryoverPairs.length === 0)
          ) {
            rebuildMasterSets();
            fullGameReset();
          } else {
            messageDiv.innerHTML =
              "ℹ️ Settings changed. Start a new game to apply.";
          }
        });

        autoSaveToggle.addEventListener("change", () => {
          saveSettings();
          autoSaveEnabled = autoSaveToggle.checked;
          messageDiv.innerHTML = autoSaveEnabled
            ? "💾 Auto-save enabled"
            : "💾 Auto-save disabled";
          setTimeout(() => {
            if (!gameCompleted) updateStatusBadge();
          }, 1500);
        });

        // Rebuild master sets with current settings
        rebuildMasterSets();

        // Check for saved game
        const saved = loadGameState();
        if (saved && saved.totalScore > 0 && !saved.gameCompleted) {
          const total = N5_MATCHING_DATA.length;
          const progress = Math.round((saved.totalScore / total) * 100);
          const confirmResume = confirm(
            `📚 Found a saved game!\n\n` +
              `Progress: ${saved.totalScore}/${total} kanji (${progress}%)\n` +
              `Sets remaining: ${MASTER_SETS.length - saved.currentOriginalSetIndex}\n` +
              `Carryover: ${saved.carryoverPairs?.length || 0} pairs\n\n` +
              `Click OK to resume, Cancel to start fresh.`,
          );
          if (confirmResume) {
            resumeFromSave();
            return;
          } else {
            clearSave();
          }
        }

        // Start fresh
        fullGameReset();

        // Start auto-save timer
        startAutoSaveTimer();

        // Handle page unload - save before closing
        window.addEventListener("beforeunload", () => {
          if (autoSaveEnabled && !gameCompleted && activeDeck.length > 0) {
            saveGameState();
          }
        });
      }

      // ============================================================
      // EVENT BINDINGS
      // ============================================================

      pauseBtn.addEventListener("click", togglePause);
      saveBtn.addEventListener("click", saveAndExit);
      resetBtn.addEventListener("click", fullGameReset);
      showStatsBtn.addEventListener("click", showStats);
      document
        .getElementById("katakanaBtn")
        .addEventListener("click", openKatakanaApp);

      // Keyboard shortcuts
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" || e.key === "p") {
          e.preventDefault();
          togglePause();
        }
        if (e.key === "s" && e.ctrlKey) {
          e.preventDefault();
          saveAndExit();
        }
      });

      // ============================================================
      // START THE GAME
      // ============================================================

      console.log(
        "🎮 Kanji Master loaded with " + N5_MATCHING_DATA.length + " N5 kanji!",
      );
      console.log("📚 Total sets: " + MASTER_SETS.length);
      console.log("⌨️ Keyboard shortcuts: ESC/P = Pause, Ctrl+S = Save");

      // Initialize
      initGame();
    </script>
  </body>
</html>
