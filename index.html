<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />

    <!-- ============================================================
       PWA META TAGS
       ============================================================ -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#1b4a36" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Kanji Master" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />

    <!-- Register Service Worker -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((registration) => {
              console.log("[PWA] Service Worker registered:", registration);
            })
            .catch((error) => {
              console.error("[PWA] Service Worker registration failed:", error);
            });
        });
      }
    </script>

    <title>Kanji Master: Persistent Memory | N5 漢字·ひらがな</title>
    <style>
      /* ============================================================
         BASE RESET & BODY
         ============================================================ */
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        background: linear-gradient(145deg, #0f2b2c 0%, #07161a 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family:
          "Segoe UI", "Noto Sans JP", "Yu Gothic", "Hiragino Sans", "Meiryo",
          system-ui, sans-serif;
        margin: 0;
        padding: 20px;
      }

      /* ============================================================
         GAME CONTAINER - Outer Card
         ============================================================ */
      .game-container {
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(5px);
        border-radius: 3rem 1.8rem 3rem 1.8rem;
        padding: 1.2rem;
        box-shadow: 0 25px 40px rgba(0, 0, 0, 0.5);
        width: 100%;
        max-width: 950px;
      }

      /* ============================================================
         GAME PANEL - Inner Card
         ============================================================ */
      .game-panel {
        background: #fff7ec;
        background-image: radial-gradient(
          circle at 20% 40%,
          rgba(210, 180, 140, 0.1) 2%,
          transparent 2.5%
        );
        background-size: 28px 28px;
        border-radius: 2rem;
        padding: 1.2rem 1rem 1.8rem;
        box-shadow:
          inset 0 1px 5px rgba(85, 55, 25, 0.1),
          0 12px 25px rgba(0, 0, 0, 0.3);
      }

      /* ============================================================
         STATS BAR
         ============================================================ */
      .stats {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;
        background: #2d3e2a;
        padding: 10px 24px;
        border-radius: 60px;
        color: #faefcf;
        font-weight: bold;
      }

      .score-box,
      .set-box,
      .penalty-box {
        background: #1a2c18;
        padding: 5px 18px;
        border-radius: 50px;
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-size: 0.9rem;
      }

      .score-box strong,
      .set-box strong,
      .penalty-box strong {
        font-size: 1.5rem;
        font-weight: 800;
        color: #ffec9f;
        font-family: monospace;
        margin-left: 5px;
      }

      /* ============================================================
         MESSAGE AREA
         ============================================================ */
      .message-area {
        text-align: center;
        font-size: 0.95rem;
        font-weight: bold;
        background: #e8dccc;
        margin: 8px 0 20px;
        padding: 8px 12px;
        border-radius: 40px;
        color: #2f2a1f;
        transition: 0.2s;
        box-shadow:
          inset 0 1px 3px #ba9f73,
          0 2px 6px rgba(0, 0, 0, 0.1);
        min-height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px;
      }

      /* ============================================================
         GRID - Matching Game Cards
         ============================================================ */
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px 12px;
        justify-items: center;
        align-items: center;
        margin: 10px 0 20px;
        transition: opacity 0.3s ease;
      }

      .grid.paused {
        opacity: 0.5;
        pointer-events: none;
      }

      /* ============================================================
         CARD - Individual Matching Card
         ============================================================ */
      .card {
        background: #fffbf2;
        width: 100%;
        aspect-ratio: 1 / 1;
        max-width: 115px;
        border-radius: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.18s ease;
        box-shadow: 0 8px 0 #836e48;
        border: 2px solid #ebdbbd;
        color: #2e2419;
        transform: translateY(-2px);
        font-family: "Noto Sans JP", "KaiTi", cursive;
        position: relative;
      }

      .card.matched {
        background: #8aae89;
        border-color: #3f6a3a;
        box-shadow: 0 3px 0 #2b5624;
        transform: translateY(4px);
        cursor: default;
        opacity: 0.75;
        text-decoration: line-through;
        text-decoration-thickness: 2px;
        text-decoration-color: #f9eec1;
        color: #2c2b1f;
      }

      .card.selected {
        background: #fddfa5;
        box-shadow: 0 3px 0 #bd7f2c;
        transform: translateY(3px);
        border: 2px solid #e0a23b;
        color: #4d3012;
      }

      .card[data-type="kana"] {
        font-family: "Noto Sans JP", "KaiTi", cursive;
        font-size: 1.6rem;
      }

      /* ============================================================
         QUIZ MODE - Main Container
         ============================================================ */
      .quiz-container {
        grid-column: 1/-1;
        padding: 1rem;
        background: #f8f0e0;
        border-radius: 28px;
        box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
      }

      /* ============================================================
         QUIZ SENTENCE - The main sentence display
         ============================================================ */
      .quiz-sentence {
        font-size: 1.3rem;
        /* MODIFY: Line height - controls vertical spacing */
        line-height: 3.2;
        text-align: center;
        padding: 1.2rem 1rem;
        background: white;
        border-radius: 20px;
        margin-bottom: 0.5rem;
        font-family: "Noto Sans JP", "KaiTi", cursive;
        border: 2px solid #e0d0b0;
        min-height: 80px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: default;
        gap: 0px;
      }

      .quiz-sentence .sentence-text {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0px;
      }

      /* ============================================================
         TRANSLATION TOGGLE - Show/hide English translation
         ============================================================ */
      .translation-toggle {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin: 4px 0 10px 0;
        font-size: 0.8rem;
        color: #666;
        cursor: pointer;
        user-select: none;
        transition: 0.2s;
      }

      .translation-toggle:hover {
        color: #2d3e2a;
      }

      .translation-toggle .toggle-label {
        font-weight: 600;
      }

      .translation-toggle input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
        accent-color: #4a7a4a;
      }

      .quiz-translation {
        font-size: 1rem;
        color: #4a6a4a;
        font-weight: 600;
        font-family: "Segoe UI", system-ui, sans-serif;
        padding: 6px 12px;
        background: #f0f5ea;
        border-radius: 12px;
        border-left: 3px solid #4a7a4a;
        margin-top: 6px;
        display: none;
        width: 100%;
        text-align: center;
        animation: fadeInUp 0.3s ease;
      }

      .quiz-translation.visible {
        display: block;
      }

      /* ============================================================
         FURIGANA - The reading above kanji
         MODIFY: All furigana styling here
         ============================================================ */
      .furigana {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        vertical-align: baseline;
        margin: 0 1px;
        /* MODIFY: Minimum width for each furigana block */
        min-width: 1.2em;
        /* MODIFY: Height of the furigana block (controls spacing) */
        height: 1.8em;
        position: relative;
      }

      .furigana .kanji {
        display: inline-block;
        /* MODIFY: Font size of the kanji */
        font-size: 1.4rem;
        /* MODIFY: Line height of the kanji */
        line-height: 1.3;
        vertical-align: bottom;
        position: relative;
        /* MODIFY: Fine-tune vertical position of kanji */
        top: -0.1em;
      }

      .furigana .reading {
        display: block;
        /* MODIFY: Font size of the furigana reading */
        font-size: 0.65rem;
        /* MODIFY: Line height of the furigana reading */
        line-height: 1;
        /* MODIFY: Color of furigana (Dark Red) */
        color: #8b0000;
        /* MODIFY: Font weight of furigana */
        font-weight: 800;
        /* MODIFY: Letter spacing of furigana */
        letter-spacing: 0.3px;
        font-family: "Noto Sans JP", "KaiTi", cursive;
        text-align: center;
        position: absolute;
        /* MODIFY: Position of furigana above kanji (negative value moves up) */
        top: -1.2em;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        /* MODIFY: Background behind furigana (optional) */
        /* background: rgba(255,255,255,0.7); */
        /* MODIFY: Padding around furigana (optional) */
        /* padding: 0 2px; */
        /* MODIFY: Border radius (optional) */
        /* border-radius: 4px; */
      }

      .furigana .reading.dark-red {
        color: #8b0000;
      }

      /* ============================================================
         QUIZ BLANK - The underline placeholder
         ============================================================ */
      .quiz-sentence .blank {
        display: inline-block;
        /* MODIFY: Width of the blank space */
        min-width: 45px;
        /* MODIFY: Border style of the blank underline */
        border-bottom: 3px dashed #c47d44;
        margin: 0 3px;
        color: #c47d44;
        font-weight: 800;
        /* MODIFY: Font size of the blank placeholder */
        font-size: 1.5rem;
        /* MODIFY: Height of the blank */
        height: 1.8em;
        line-height: 1.8;
        vertical-align: baseline;
      }

      /* ============================================================
         QUIZ OPTIONS - The answer buttons
         ============================================================ */
      .quiz-options {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin: 12px 0;
      }

      .quiz-option {
        padding: 14px;
        border: 2px solid #d4c4a0;
        border-radius: 16px;
        background: white;
        font-size: 1.3rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.15s ease;
        font-family: "Noto Sans JP", "KaiTi", cursive;
        text-align: center;
      }

      .quiz-option:active {
        transform: scale(0.96);
      }

      .quiz-option:hover:not(.disabled) {
        background: #f5f0e0;
      }

      .quiz-option.correct {
        background: #8aae89;
        border-color: #3f6a3a;
        color: white;
        cursor: default;
      }

      .quiz-option.wrong {
        background: #e8a0a0;
        border-color: #a04040;
        color: white;
        cursor: default;
      }

      .quiz-option.disabled {
        cursor: default;
        opacity: 0.6;
      }

      .quiz-option.reveal-correct {
        background: #8aae89;
        border-color: #3f6a3a;
        color: white;
        cursor: default;
      }

      /* ============================================================
         QUIZ EXPLANATION - The answer explanation
         ============================================================ */
      .quiz-explanation {
        background: #e8f0e0;
        padding: 12px 16px;
        border-radius: 16px;
        margin-top: 12px;
        font-size: 0.95rem;
        line-height: 2.2;
        display: none;
        border-left: 4px solid #4a7a4a;
      }

      .quiz-explanation .furigana {
        height: 1.6em;
      }

      .quiz-explanation .furigana .kanji {
        font-size: 1.1rem;
        top: -0.05em;
      }

      .quiz-explanation .furigana .reading {
        font-size: 0.5rem;
        top: -1.1em;
        color: #8b0000;
      }

      .quiz-explanation.visible {
        display: block;
        animation: fadeInUp 0.3s ease;
      }

      /* ============================================================
         QUIZ NAVIGATION BUTTONS
         ============================================================ */
      .quiz-nav {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 12px;
        flex-wrap: wrap;
      }

      .quiz-nav button {
        padding: 10px 20px;
        border: none;
        border-radius: 50px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.05s linear;
        font-family: inherit;
        font-size: 0.9rem;
      }

      .quiz-nav button:active {
        transform: scale(0.96);
      }

      .quiz-nav .next-btn {
        background: #4a7a4a;
        color: white;
        box-shadow: 0 4px 0 #2a5a2a;
      }

      .quiz-nav .skip-btn {
        background: #8a7a4a;
        color: white;
        box-shadow: 0 4px 0 #5a4a2a;
      }

      .quiz-nav .hint-btn {
        background: #c47d44;
        color: white;
        box-shadow: 0 4px 0 #8a5a2a;
      }

      .quiz-nav .speak-btn {
        background: #4a6a7a;
        color: white;
        box-shadow: 0 4px 0 #2a4a5a;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .quiz-nav .speak-btn:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #2a4a5a;
      }

      /* ============================================================
         QUIZ PROGRESS BAR
         ============================================================ */
      .quiz-progress {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        font-weight: 600;
        color: #2d3e2a;
        font-size: 0.9rem;
      }

      .quiz-score {
        background: #2d3e2a;
        padding: 4px 16px;
        border-radius: 50px;
        color: #faefcf;
      }

      /* ============================================================
         QUIZ COMPLETE SCREEN
         ============================================================ */
      .quiz-complete {
        grid-column: 1/-1;
        text-align: center;
        padding: 2rem;
        background: #f0e2b6;
        border-radius: 40px;
      }

      .quiz-complete .final-score {
        font-size: 2.5rem;
        font-weight: 800;
        color: #2d3e2a;
        margin: 10px 0;
      }

      .quiz-complete .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 12px;
        margin: 16px 0;
      }

      .quiz-complete .stat-item {
        background: white;
        padding: 12px;
        border-radius: 16px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      }

      .quiz-complete .stat-item .label {
        font-size: 0.8rem;
        color: #666;
      }

      .quiz-complete .stat-item .value {
        font-size: 1.5rem;
        font-weight: 800;
        color: #2d3e2a;
      }

      /* ============================================================
         FOOTER BUTTONS - Bottom action buttons
         ============================================================ */
      .footer {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 5px;
        flex-wrap: wrap;
      }

      .footer button {
        background: #746139;
        border: none;
        font-size: 0.9rem;
        font-weight: bold;
        padding: 8px 16px;
        border-radius: 50px;
        color: #fef3df;
        cursor: pointer;
        transition: 0.05s linear;
        box-shadow: 0 4px 0 #47381f;
        letter-spacing: 0.5px;
        font-family: inherit;
        flex: 0 1 auto;
        min-width: 60px;
      }

      .footer button:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #47381f;
      }

      .footer button:disabled {
        opacity: 0.5;
        transform: translateY(2px);
        box-shadow: 0 2px 0 #47381f;
        cursor: not-allowed;
      }

      .footer button.pause-btn {
        background: #4a6a7a;
        box-shadow: 0 4px 0 #2a4a5a;
      }

      .footer button.save-btn {
        background: #4a7a4a;
        box-shadow: 0 4px 0 #2a5a2a;
      }

      .footer button.danger-btn {
        background: #8a4a4a;
        box-shadow: 0 4px 0 #5a2a2a;
      }

      .footer button.stats-btn {
        background: #7a6a4a;
        box-shadow: 0 4px 0 #4a3a2a;
      }

      .footer button.katakana-btn {
        background: #7a5a7a;
        box-shadow: 0 4px 0 #4a3a4a;
      }

      .footer button.quiz-btn {
        background: #4a6a5a;
        box-shadow: 0 4px 0 #2a4a3a;
      }

      .footer button.quiz-btn.active {
        background: #c47d44;
        box-shadow: 0 4px 0 #8a5a2a;
      }

      .footer button.katakana-btn:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #4a3a4a;
      }

      /* ============================================================
         PROGRESS BAR - Match progress
         ============================================================ */
      .progress-bar {
        width: 100%;
        height: 6px;
        background: #2d3e2a;
        border-radius: 10px;
        margin: 8px 0 12px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #ffec9f, #f5c842);
        border-radius: 10px;
        transition: width 0.5s ease;
        width: 0%;
      }

      /* ============================================================
         GAME COMPLETE SCREEN
         ============================================================ */
      .game-complete {
        grid-column: 1/-1;
        text-align: center;
        padding: 2rem;
        font-size: 1.5rem;
        background: #f0e2b6;
        border-radius: 40px;
      }

      /* ============================================================
         SAVE SCREEN
         ============================================================ */
      .save-screen {
        grid-column: 1/-1;
        text-align: center;
        padding: 2rem;
        background: #e8f0d6;
        border-radius: 40px;
      }

      .save-screen h2 {
        margin: 10px 0;
        color: #2d3e2a;
      }

      .save-screen .progress-text {
        font-size: 1.2rem;
        color: #3a5a3a;
      }

      .save-screen .sub-text {
        font-size: 0.9rem;
        color: #666;
        margin: 8px 0;
      }

      .save-screen .btn-group {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 15px;
      }

      .save-screen .btn-group button {
        padding: 10px 24px;
        border: none;
        border-radius: 50px;
        font-weight: bold;
        font-size: 1rem;
        cursor: pointer;
        transition: 0.1s ease;
      }

      .save-screen .btn-group button:active {
        transform: scale(0.96);
      }

      .btn-resume {
        background: #4a7a4a;
        color: white;
        box-shadow: 0 4px 0 #2a5a2a;
      }

      .btn-newgame {
        background: #8a6a3a;
        color: white;
        box-shadow: 0 4px 0 #5a4a2a;
      }

      /* ============================================================
         STATUS INDICATORS
         ============================================================ */
      .status-indicators {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      .status-badge {
        font-size: 0.7rem;
        padding: 2px 10px;
        border-radius: 20px;
        background: #1a2c18;
        color: #faefcf;
      }

      .status-badge.paused-badge {
        background: #4a6a7a;
        animation: pulse 1.5s ease-in-out infinite;
      }

      .status-badge.quiz-badge {
        background: #c47d44;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      /* ============================================================
         SETTINGS ROW
         ============================================================ */
      .settings-row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 10px;
        justify-content: center;
      }

      .settings-row select {
        background: #2d3e2a;
        color: #faefcf;
        border: none;
        padding: 6px 12px;
        border-radius: 30px;
        font-family: inherit;
        font-size: 0.85rem;
        cursor: pointer;
      }

      .settings-row label {
        color: #2d3e2a;
        font-size: 0.85rem;
        font-weight: bold;
      }

      .auto-save-indicator {
        font-size: 0.7rem;
        color: #4a7a4a;
        background: #e8f0d6;
        padding: 2px 10px;
        border-radius: 20px;
      }

      /* ============================================================
         NEXT SET BUTTON
         ============================================================ */
      .next-set-container {
        grid-column: 1/-1;
        text-align: center;
        margin-top: 10px;
        animation: fadeInUp 0.3s ease;
      }

      .next-set-btn {
        padding: 14px 40px;
        border: none;
        border-radius: 50px;
        background: #4a7a4a;
        color: white;
        font-weight: bold;
        font-size: 1.2rem;
        cursor: pointer;
        box-shadow: 0 4px 0 #2a5a2a;
        transition: 0.05s linear;
        font-family: inherit;
      }

      .next-set-btn:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #2a5a2a;
      }

      .next-set-btn.review {
        background: #c47d44;
        box-shadow: 0 4px 0 #8a5a2a;
      }

      .next-set-btn.review:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #8a5a2a;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ============================================================
         RESPONSIVE - Mobile Adjustments
         ============================================================ */
      @media (max-width: 550px) {
        .grid {
          gap: 8px;
        }
        .card {
          font-size: 1.4rem;
          border-radius: 20px;
        }
        .card[data-type="kana"] {
          font-size: 1.1rem;
        }
        .score-box strong,
        .set-box strong {
          font-size: 1.2rem;
        }
        .stats {
          padding: 8px 14px;
          gap: 6px;
        }
        .score-box,
        .set-box,
