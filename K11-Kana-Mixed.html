<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kana Mixed · Reading + Listening</title>

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kana Mixed" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />

    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; user-select: none; }

      body {
        background: #111;
        color: #fff;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        font-family: "Segoe UI", "Noto Sans JP", "Roboto", system-ui, -apple-system, sans-serif;
        overflow-y: auto;
      }

      /* TOP BAR */
      .top-bar {
        display: flex; justify-content: space-between; align-items: center;
        padding: 16px 20px; padding-top: max(16px, env(safe-area-inset-top)); z-index: 10;
        flex-shrink: 0;
      }
      .top-bar-left, .top-bar-right {
        display: flex; align-items: center; gap: 6px;
      }
      .nav-btn {
        background: transparent; border: none; color: #fff; font-size: 1.3rem;
        cursor: pointer; padding: 8px 12px; line-height: 1; opacity: 0.6;
        border-radius: 12px; transition: opacity 0.15s, background 0.15s;
      }
      .nav-btn:hover { opacity: 1; background: rgba(255,255,255,0.1); }

      .autoplay-btn {
        background: rgba(255, 213, 79, 0.15);
        border: 1.5px solid #ffd54f;
        color: #ffd54f;
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.05em;
        cursor: pointer;
        padding: 6px 12px;
        border-radius: 20px;
        transition: all 0.15s ease;
        font-family: inherit;
      }
      .autoplay-btn:hover { background: rgba(255, 213, 79, 0.25); }
      .autoplay-btn:active { transform: scale(0.95); }
      .autoplay-btn.off {
        background: rgba(136, 136, 136, 0.15);
        border-color: #555;
        color: #888;
      }

      .mode-indicator {
        font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em;
        text-transform: uppercase; opacity: 0.9;
        padding: 4px 14px; border-radius: 20px;
        transition: background 0.3s ease, color 0.3s ease;
      }
      .mode-indicator.listening { background: rgba(0,230,118,0.15); color: #00e676; }
      .mode-indicator.reading   { background: rgba(0,176,255,0.15); color: #00b0ff; }

      /* SESSION PICKER */
      .session-bar {
        display: flex; gap: 6px; padding: 0 20px 8px; justify-content: center;
        align-items: center; z-index: 10; flex-shrink: 0;
        flex-wrap: wrap;
      }
      .session-bar-label {
        font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em;
        text-transform: uppercase; color: #666; margin-right: 4px;
      }
      .session-btn {
        background: #1e1e1e; border: 1.5px solid #2a2a2a; color: #888;
        font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em;
        cursor: pointer; padding: 6px 14px; border-radius: 20px;
        transition: all 0.15s ease; font-family: inherit;
      }
      .session-btn:hover:not(.active) { border-color: #444; color: #ccc; }
      .session-btn.active {
        background: #ffd54f; border-color: #ffd54f; color: #000;
      }
      .session-counter {
        font-size: 0.72rem; font-weight: 700; color: #ffd54f;
        padding: 4px 12px; border-radius: 20px;
        background: rgba(255, 213, 79, 0.12);
        border: 1px solid rgba(255, 213, 79, 0.3);
        letter-spacing: 0.04em;
      }

      /* GROUP TABS */
      .mode-tabs {
        display: flex; gap: 6px; padding: 0 20px 12px; justify-content: center; z-index: 10;
        flex-shrink: 0;
      }
      .mode-tab {
        flex: 1; max-width: 140px; padding: 10px 6px; border-radius: 24px;
        background: #1e1e1e; border: 2px solid #2a2a2a; color: #888;
        font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em;
        text-transform: uppercase; cursor: pointer; transition: all 0.2s ease;
        font-family: inherit;
      }
      .mode-tab:hover:not(.active):not(.locked) { border-color: #444; color: #ccc; }
      .mode-tab.active { background: #ffd54f; border-color: #ffd54f; color: #000; }
      .mode-tab.locked { opacity: 0.35; cursor: not-allowed; }
      .mode-tab.locked::after { content: " 🔒"; }

      /* PROGRESS BARS */
      .session-progress-container {
        width: 100%; height: 6px; background: #333; z-index: 10; flex-shrink: 0;
        margin-bottom: 4px;
      }
      .session-progress-bar {
        height: 100%; background: #ffd54f; width: 0%;
        transition: width 0.4s ease;
        box-shadow: 0 0 8px rgba(255, 213, 79, 0.5);
      }
      
      .mastery-progress-container { 
        width: 100%; height: 3px; background: #222; z-index: 10; flex-shrink: 0; 
      }
      .mastery-progress-bar { 
        height: 100%; background: #ffd54f; width: 0%; 
        transition: width 0.4s ease; opacity: 0.4;
      }

      /* GAME AREA */
      .game-area {
        flex: 1; display: flex; flex-direction: column; justify-content: flex-start;
        align-items: center; padding: 20px 20px 20px; position: relative; gap: 16px;
        min-height: 0;
      }

      /* LISTENING CARD: speaker button */
      .speaker-btn {
        width: 100px; height: 100px; border-radius: 50%;
        background: #1e1e1e; border: 3px solid #333; color: #fff;
        font-size: 2.5rem; cursor: pointer; display: flex; justify-content: center;
        align-items: center; transition: all 0.15s ease; box-shadow: 0 6px 0 #000;
        font-family: inherit;
        flex-shrink: 0;
        margin-top: 10px;
      }
      .speaker-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #000; }
      .speaker-btn.speaking {
        background: #ffd54f; border-color: #ffd54f; color: #000;
        animation: pulse 0.8s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      /* READING CARD: big kana */
      .target-kana {
        font-size: 6rem; font-weight: 900; line-height: 1;
        font-family: "Noto Sans JP", sans-serif;
        cursor: pointer;
        transition: color 0.2s ease, transform 0.1s ease;
        text-align: center;
        animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        user-select: none;
        margin-top: 10px;
      }
      .target-kana.digraph { font-size: 4rem; }
      .target-kana:active { transform: scale(0.95); }
      .target-kana.speaking { color: #ffd54f; }

      @keyframes popIn {
        0% { transform: scale(0.8); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }

      .instruction {
        font-size: 0.85rem; color: #888; font-weight: 600;
        letter-spacing: 0.04em; text-align: center;
        min-height: 1.2em;
      }

      /* 3x3 GRID (shared by both card types) */
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        width: 100%;
        max-width: 340px;
      }

      /* Listening tile: shows kana */
      .cell {
        aspect-ratio: 1 / 1;
        background: #1e1e1e;
        border: 2px solid #333;
        border-radius: 20px;
        color: #fff;
        font-size: 2.8rem;
        font-weight: 800;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.12s ease;
        font-family: "Noto Sans JP", sans-serif;
        box-shadow: 0 4px 0 #000;
        position: relative;
        min-height: 48px;
        min-width: 48px;
      }
      .cell[data-length="2"] { font-size: 2rem; }
      .cell:active:not(.disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
      .cell.correct { background: #00e676; border-color: #00e676; color: #000; box-shadow: 0 4px 0 #009624; }
      .cell.wrong   { background: #d500f9; border-color: #d500f9; color: #fff; box-shadow: 0 4px 0 #9c00b3; }
      .cell.reveal  { background: #00e676; border-color: #00e676; color: #000; opacity: 0.6; }
      .cell.disabled { pointer-events: none; }

      /* Reading tile: shows speaker glyph */
      .tile {
        aspect-ratio: 1 / 1;
        background: #1e1e1e;
        border: 2px solid #333;
        border-radius: 20px;
        color: #fff;
        font-size: 2rem;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.12s ease;
        box-shadow: 0 4px 0 #000;
        position: relative;
        min-height: 48px;
        min-width: 48px;
        font-family: inherit;
      }
      .tile:active:not(.disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
      .tile.listened {
        border-color: #ffd54f;
        box-shadow: 0 0 0 3px rgba(255, 213, 79, 0.35), 0 4px 0 #000;
        background: #2a2416;
      }
      .tile.correct { background: #00e676; border-color: #00e676; color: #000; box-shadow: 0 4px 0 #009624; }
      .tile.wrong   { background: #d500f9; border-color: #d500f9; color: #fff; box-shadow: 0 4px 0 #9c00b3; }
      .tile.reveal  { background: #00e676; border-color: #00e676; color: #000; opacity: 0.6; }
      .tile.disabled { pointer-events: none; }
      .tile .speaker-glyph { font-size: 1.8rem; opacity: 0.85; }

      /* PER-CARD PROGRESS */
      .card-progress {
        display: flex; align-items: center; gap: 10px;
        font-size: 0.75rem; color: #666; font-weight: 600;
        flex-shrink: 0;
        margin-top: 4px;
      }
      .card-progress-bar {
        width: 80px; height: 4px; background: #333; border-radius: 4px; overflow: hidden;
      }
      .card-progress-fill {
        height: 100%; background: #ffd54f; width: 0%; transition: width 0.3s ease;
      }

      /* SESSION COMPLETE PANEL */
      .session-complete {
        display: flex; flex-direction: column; align-items: center;
        text-align: center; padding: 2rem 1rem; max-width: 340px;
        animation: fadeInUp 0.3s ease;
      }
      .session-complete .trophy { font-size: 4rem; margin-bottom: 12px; }
      .session-complete h2 { font-size: 1.4rem; color: #fff; margin-bottom: 8px; }
      .session-complete p {
        font-size: 0.9rem; color: #888; margin-bottom: 24px; line-height: 1.5;
      }
      .session-complete .buttons {
        display: flex; flex-direction: column; gap: 10px; width: 100%;
      }
      .session-complete button {
        padding: 14px 24px; border-radius: 50px; border: none;
        font-family: inherit; font-size: 0.95rem; font-weight: 800;
        cursor: pointer; transition: transform 0.1s ease; letter-spacing: 0.03em;
      }
      .session-complete button:active { transform: scale(0.97); }
      .session-complete .continue-btn {
        background: #ffd54f; color: #000; box-shadow: 0 4px 0 #c0a030;
      }
      .session-complete .home-btn {
        background: #333; color: #fff;
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* TOAST */
      .toast-popup {
        position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-10px);
        background: #333; color: #fff; padding: 10px 20px; border-radius: 40px;
        font-size: 0.85rem; font-weight: 600; z-index: 9000; opacity: 0;
        pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease;
        max-width: 90vw; text-align: center;
      }
      .toast-popup.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      /* SMALL SCREENS */
      @media (max-width: 400px) {
        .grid { gap: 8px; max-width: 300px; }
        .cell { font-size: 2.2rem; border-radius: 16px; }
        .cell[data-length="2"] { font-size: 1.6rem; }
        .tile { border-radius: 16px; font-size: 1.6rem; }
        .tile .speaker-glyph { font-size: 1.4rem; }
        .speaker-btn { width: 90px; height: 90px; font-size: 2rem; }
        .target-kana { font-size: 5rem; }
        .target-kana.digraph { font-size: 3.5rem; }
        .game-area { gap: 12px; padding-top: 10px; }
        .autoplay-btn { font-size: 0.65rem; padding: 5px 10px; }
        .session-btn { font-size: 0.65rem; padding: 5px 10px; }
        .session-counter { font-size: 0.65rem; padding: 3px 10px; }
      }
    </style>
  </head>
  <body>
    <div class="top-bar">
      <div class="top-bar-left">
        <button class="nav-btn" id="backBtn" title="Back">← Back</button>
      </div>
      <span class="mode-indicator" id="modeIndicator">Mixed</span>
      <div class="top-bar-right">
        <button class="autoplay-btn" id="autoPlayBtn" title="Toggle auto-play sound">🔊 Auto</button>
        <button class="nav-btn" id="resetBtn" title="Reset this script">⟳</button>
      </div>
    </div>

    <!-- SESSION PICKER -->
    <div class="session-bar">
      <span class="session-bar-label">Session</span>
      <button class="session-btn" data-size="10">10</button>
      <button class="session-btn active" data-size="20">20</button>
      <button class="session-btn" data-size="all">All</button>
      <span class="session-counter" id="sessionCounter">0 / 20</span>
    </div>

    <div class="mode-tabs" id="modeTabs">
      <button class="mode-tab active" data-group="basic">Basic</button>
      <button class="mode-tab" data-group="voiced">Voiced</button>
      <button class="mode-tab" data-group="yoon">Yōon</button>
    </div>

    <div class="progress-bar-container">
      <div class="session-progress-container">
        <div class="session-progress-bar" id="sessionProgressBar"></div>
      </div>
      <div class="mastery-progress-container">
        <div class="mastery-progress-bar" id="progressBar"></div>
      </div>
    </div>

    <div class="game-area" id="gameArea">
      <!-- Rendered dynamically per card -->
    </div>

    <div class="toast-popup" id="toastPopup"></div>

    <!-- DATA + STATE -->
    <script src="kanaMasterData.js"></script>
    <script src="kanaState.js"></script>
    <script src="kanaData.js"></script>

    <script>
      // ============================================================
      // CONFIG
      // ============================================================
      const SCRIPT = "hiragana";
      const GRID_SIZE = 9; // 3x3 grid
      const AUTOPLAY_STORAGE_KEY = `kanaAutoplay_${SCRIPT}`;
      const SESSION_STORAGE_KEY = "kanaSessionSize";
      let AUTO_PLAY = true;

      let sessionSizeMode = 20;
      let sessionCap = 20;
      let sessionAnswered = 0;
      let sessionCorrect = 0;
      let sessionComplete = false;

      const HOMOPHONE_PAIRS = [
        ["じ", "ぢ"], ["ず", "づ"],
        ["ジ", "ヂ"], ["ズ", "ヅ"],
      ];

      // ============================================================
      // STATE
      // ============================================================
      let currentGroup = "basic";
      let currentChar = null;
      let currentDirection = null;
      let currentGrid = [];
      let listenedChar = null;
      let isAnswered = false;
      let isSpeaking = false;
      let autoSpeakTimeout = null;
      let ttsWatchdog = null;
      let audioPrimed = false;

      // DOM
      const gameArea        = document.getElementById("gameArea");
      const progressBar     = document.getElementById("progressBar");
      const sessionProgressBar = document.getElementById("sessionProgressBar");
      const modeIndicator   = document.getElementById("modeIndicator");
      const toastPopup      = document.getElementById("toastPopup");
      const modeTabs        = document.getElementById("modeTabs");
      const autoPlayBtn     = document.getElementById("autoPlayBtn");
      const sessionCounter  = document.getElementById("sessionCounter");
      const sessionBtns     = document.querySelectorAll(".session-btn");

      // Helper accessors (game area re-renders)
      function getSpeakerBtn() { return document.getElementById("speakerBtn"); }
      function getTargetKana() { return document.getElementById("targetKana"); }
      function getInstruction() { return document.getElementById("instruction"); }
      function getGridEl() { return document.getElementById("grid"); }
      function getCardProgressLabel() { return document.getElementById("cardProgressLabel"); }
      function getCardProgressFill() { return document.getElementById("cardProgressFill"); }

      // ============================================================
      // AUTOPLAY PERSISTENCE
      // ============================================================
      function loadAutoPlayPref() {
        try {
          const stored = localStorage.getItem(AUTOPLAY_STORAGE_KEY);
          if (stored !== null) AUTO_PLAY = stored === "true";
        } catch (e) { console.warn("[autoplay] load failed:", e); }
      }

      function saveAutoPlayPref() {
        try { localStorage.setItem(AUTOPLAY_STORAGE_KEY, AUTO_PLAY ? "true" : "false"); }
        catch (e) { console.warn("[autoplay] save failed:", e); }
      }

      function updateAutoPlayButton() {
        if (AUTO_PLAY) {
          autoPlayBtn.textContent = "🔊 Auto";
          autoPlayBtn.classList.remove("off");
        } else {
          autoPlayBtn.textContent = "🔇 Off";
          autoPlayBtn.classList.add("off");
        }
      }

      function toggleAutoPlay() {
        AUTO_PLAY = !AUTO_PLAY;
        saveAutoPlayPref();
        updateAutoPlayButton();
        if (AUTO_PLAY && currentChar && !sessionComplete) {
          clearTimeout(autoSpeakTimeout);
          speakKana(currentChar);
        }
      }

      // ============================================================
      // SESSION SIZE
      // ============================================================
      function loadSessionPref() {
        try {
          const stored = localStorage.getItem(SESSION_STORAGE_KEY);
          if (stored === "all") sessionSizeMode = "all";
          else if (stored === "10") sessionSizeMode = 10;
          else if (stored === "20") sessionSizeMode = 20;
        } catch (e) { console.warn("[session] load failed:", e); }
      }

      function saveSessionPref() {
        try { localStorage.setItem(SESSION_STORAGE_KEY, String(sessionSizeMode)); }
        catch (e) { console.warn("[session] save failed:", e); }
      }

      function resolveSessionCap() {
        const poolLength = getGroupPool(SCRIPT, currentGroup).length;
        if (sessionSizeMode === "all") return poolLength;
        return Math.min(sessionSizeMode, poolLength);
      }

      function updateSessionButtons() {
        sessionBtns.forEach(btn => {
          const size = btn.dataset.size;
          let isActive = false;
          if (size === "all") isActive = (sessionSizeMode === "all");
          else isActive = (Number(size) === sessionSizeMode);
          btn.classList.toggle("active", isActive);
        });
      }

            function updateSessionCounter() {
        sessionCounter.textContent = `${sessionAnswered} / ${sessionCap}`;
        // The bar now reflects CORRECT answers, not total attempts.
        const pct = sessionCap > 0 ? (sessionCorrect / sessionCap) * 100 : 0;
        sessionProgressBar.style.width = pct + "%";
      }

      function setSessionSize(mode) {
        sessionSizeMode = (mode === "all") ? "all" : Number(mode);
        saveSessionPref();
        updateSessionButtons();
        sessionCap = resolveSessionCap();
        sessionAnswered = 0;
        sessionCorrect = 0;
        sessionComplete = false;
        updateSessionCounter();
        updateGroupProgressBar();
        updateGroupTabs();
        nextCard();
        showToast(`Session size: ${sessionSizeMode === "all" ? "All" : sessionSizeMode}`);
      }

      // ============================================================
      // HOMOPHONE HELPER
      // ============================================================
      function isHomophoneMatch(tappedChar, answerChar) {
        if (tappedChar === answerChar) return true;
        return HOMOPHONE_PAIRS.some(pair =>
          pair.includes(tappedChar) && pair.includes(answerChar)
        );
      }

      // ============================================================
      // TOAST
      // ============================================================
      let toastTimer = null;
      function showToast(msg) {
        toastPopup.innerText = msg;
        toastPopup.classList.add("show");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastPopup.classList.remove("show"), 1800);
      }

      // ============================================================
      // AUDIO - MP3 WITH TTS FALLBACK
      // ============================================================
      const ROMAJI_MAP = {
        "あ": "a", "い": "i", "う": "u", "え": "e", "お": "o",
        "か": "ka", "き": "ki", "く": "ku", "け": "ke", "こ": "ko",
        "さ": "sa", "し": "shi", "す": "su", "せ": "se", "そ": "so",
        "た": "ta", "ち": "chi", "つ": "tsu", "て": "te", "と": "to",
        "な": "na", "に": "ni", "ぬ": "nu", "ね": "ne", "の": "no",
        "は": "ha", "ひ": "hi", "ふ": "fu", "へ": "he", "ほ": "ho",
        "ま": "ma", "み": "mi", "む": "mu", "め": "me", "も": "mo",
        "や": "ya", "ゆ": "yu", "よ": "yo",
        "ら": "ra", "り": "ri", "る": "ru", "れ": "re", "ろ": "ro",
        "わ": "wa", "を": "wo", "ん": "n",
        "が": "ga", "ぎ": "gi", "ぐ": "gu", "げ": "ge", "ご": "go",
        "ざ": "za", "じ": "ji", "ず": "zu", "ぜ": "ze", "ぞ": "zo",
        "だ": "da", "ぢ": "di", "づ": "du", "で": "de", "ど": "do",
        "ば": "ba", "び": "bi", "ぶ": "bu", "べ": "be", "ぼ": "bo",
        "ぱ": "pa", "ぴ": "pi", "ぷ": "pu", "ぺ": "pe", "ぽ": "po",
        "きゃ": "kya", "きゅ": "kyu", "きょ": "kyo",
        "しゃ": "sya", "しゅ": "syu", "しょ": "syo",
        "ちゃ": "cya", "ちゅ": "cyu", "ちょ": "cyo",
        "にゃ": "nya", "にゅ": "nyu", "にょ": "nyo",
        "ひゃ": "hya", "ひゅ": "hyu", "ひょ": "hyo",
        "みゃ": "mya", "みゅ": "myu", "みょ": "myo",
        "りゃ": "rya", "りゅ": "ryu", "りょ": "ryo",
        "ぎゃ": "gya", "ぎゅ": "gyu", "ぎょ": "gyo",
        "じゃ": "zya", "じゅ": "zyu", "じょ": "zyo",
        "びゃ": "bya", "びゅ": "byu", "びょ": "byo",
        "ぴゃ": "pya", "ぴゅ": "pyu", "ぴょ": "pyo"
      };

      const DAKUON_CHARS = ["が","ぎ","ぐ","げ","ご","ざ","じ","ず","ぜ","ぞ","だ","ぢ","づ","で","ど","ば","び","ぶ","べ","ぼ"];
      const HANDAKUON_CHARS = ["ぱ","ぴ","ぷ","ぺ","ぽ"];

      let currentAudio = null;

      function clearTtsWatchdog() {
        if (ttsWatchdog) { clearTimeout(ttsWatchdog); ttsWatchdog = null; }
      }

      function releaseSpeakingState(onEnd) {
        isSpeaking = false;
        const sb = getSpeakerBtn();
        if (sb) sb.classList.remove("speaking");
        const tk = getTargetKana();
        if (tk) tk.classList.remove("speaking");
        if (onEnd) onEnd();
      }

      function speakKana(char, onEnd) {
        clearTtsWatchdog();
        if (currentAudio) {
          currentAudio.onended = null;
          currentAudio.onerror = null;
          try { currentAudio.pause(); currentAudio.currentTime = 0; } catch (e) {}
          currentAudio = null;
        }
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        isSpeaking = false;

        let lookupChar = char;
        if (SCRIPT === "katakana") {
          const allKana = [...BASIC_KANA, ...DAKUTEN_KANA, ...HANDAKUTEN_KANA, ...YOON_DIGRAPHS];
          const match = allKana.find(item => item.kata === char);
          if (match) lookupChar = match.hira;
        }
        const romaji = ROMAJI_MAP[lookupChar];
        if (!romaji) { fallbackToTTS(char, onEnd); return; }

        let folder = "seion";
        if (DAKUON_CHARS.includes(lookupChar)) folder = "dakuon";
        else if (HANDAKUON_CHARS.includes(lookupChar)) folder = "handakuon";
        else if ([...lookupChar].length > 1) folder = "yoon";

        isSpeaking = true;
        const sb = getSpeakerBtn();
        const tk = getTargetKana();
        if (sb) sb.classList.add("speaking");
        if (tk) tk.classList.add("speaking");

        const audioPath = `sounds/${folder}/${romaji}.mp3`;
        const audio = new Audio(audioPath);
        currentAudio = audio;

        audio.onended = () => {
          if (currentAudio !== audio) return;
          currentAudio = null;
          releaseSpeakingState(onEnd);
        };

        audio.onerror = () => {
          if (currentAudio !== audio) return;
          currentAudio = null;
          console.warn(`[audio] MP3 missing for ${char} (${audioPath}) → TTS fallback`);
          fallbackToTTS(char, onEnd);
        };

        const playPromise = audio.play();
        if (playPromise && typeof playPromise.catch === "function") {
          playPromise.catch((err) => {
            if (currentAudio !== audio) return;
            currentAudio = null;
            console.warn(`[audio] play() rejected for ${char} (${audioPath}):`, err?.name || err);
            fallbackToTTS(char, onEnd);
          });
        }
      }

      function fallbackToTTS(char, onEnd) {
        if (!window.speechSynthesis) { releaseSpeakingState(onEnd); return; }

        isSpeaking = true;
        const sb = getSpeakerBtn();
        const tk = getTargetKana();
        if (sb) sb.classList.add("speaking");
        if (tk) tk.classList.add("speaking");

        const utter = new SpeechSynthesisUtterance(char);
        utter.lang = "ja-JP";
        utter.rate = 0.75;
        utter.pitch = 1;
        const voices = window.speechSynthesis.getVoices();
        const jp = voices.find(v => v.lang.startsWith("ja"));
        if (jp) utter.voice = jp;

        let settled = false;
        const finish = () => {
          if (settled) return;
          settled = true;
          clearTtsWatchdog();
          utter.onend = null;
          utter.onerror = null;
          releaseSpeakingState(onEnd);
        };

        utter.onend = finish;
        utter.onerror = (e) => {
          if (e && e.error === "interrupted") return;
          console.warn(`[tts] error for ${char}:`, e?.error);
          finish();
        };

        const estimate = Math.max(1500, char.length * 400 + 1500);
        clearTtsWatchdog();
        ttsWatchdog = setTimeout(() => {
          console.warn(`[tts] watchdog fired for ${char} — forcing completion`);
          try { window.speechSynthesis.cancel(); } catch (e) {}
          finish();
        }, estimate);

        try { window.speechSynthesis.speak(utter); }
        catch (e) { console.warn("[tts] speak() threw:", e); finish(); }
      }

      // ============================================================
      // PROGRESS UI
      // ============================================================
      function updateGroupProgressBar() {
        const groups = unlockedGroups(SCRIPT);
        let sum = 0, count = 0;
        groups.forEach(g => {
          getGroupPool(SCRIPT, g).forEach(k => {
            sum += getProgressValue(SCRIPT, k.char);
            count++;
          });
        });
        const pct = count > 0 ? (sum / count) * 100 : 0;
        progressBar.style.width = pct + "%";
      }

      function updateCardProgress() {
        if (!currentChar) return;
        const labelEl = getCardProgressLabel();
        const fillEl  = getCardProgressFill();
        if (labelEl) labelEl.innerText = getProgressLabel(SCRIPT, currentChar);
        if (fillEl)  fillEl.style.width = (getProgressValue(SCRIPT, currentChar) * 100) + "%";
      }

      function updateGroupTabs() {
        modeTabs.querySelectorAll(".mode-tab").forEach(tab => {
          const g = tab.dataset.group;
          const unlocked = groupUnlocked(SCRIPT, g);
          const isActive = g === currentGroup;
          tab.classList.toggle("active", isActive);
          tab.classList.toggle("locked", !unlocked);
          tab.disabled = !unlocked;
        });
      }

      function updateModeIndicator(direction) {
        modeIndicator.classList.remove("listening", "reading");
        if (direction === "listening") {
          modeIndicator.textContent = "🎧 Listening";
          modeIndicator.classList.add("listening");
        } else if (direction === "reading") {
          modeIndicator.textContent = "📖 Reading";
          modeIndicator.classList.add("reading");
        } else {
          modeIndicator.textContent = "Mixed";
        }
      }

      // ============================================================
      // SESSION COMPLETE PANEL
      // ============================================================
            function showSessionComplete() {
        sessionComplete = true;
        isAnswered = true;
        clearTimeout(autoSpeakTimeout);
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        if (currentAudio) {
          try { currentAudio.pause(); } catch (e) {}
          currentAudio = null;
        }
        isSpeaking = false;
        if (typeof updateModeIndicator === "function") updateModeIndicator(null);

        const groupName = currentGroup.charAt(0).toUpperCase() + currentGroup.slice(1);
        const accuracy = sessionAnswered > 0 ? (sessionCorrect / sessionAnswered) : 0;
        
        let icon = "📈";
        let title = "Session Complete";
        let msg = `You got <strong>${sessionCorrect} / ${sessionAnswered}</strong> correct.<br>Good effort! Keep practicing to lock them in.`;

        // 4-Tier Feedback System
        if (accuracy === 1.0) {
          icon = "👑";
          title = "You're a Champion!";
          msg = `<strong>100% Perfect!</strong> You got all ${sessionAnswered} correct.<br>Flawless execution!`;
        } else if (accuracy >= 0.8) {
          icon = "🏆";
          title = "Excellent Work!";
          msg = `You got <strong>${sessionCorrect} / ${sessionAnswered}</strong> correct.<br>You're really getting the hang of this!`;
        } else if (accuracy < 0.4) {
          icon = "💪";
          title = "Session Complete";
          msg = `You got <strong>${sessionCorrect} / ${sessionAnswered}</strong> correct.<br>More review needed — mistakes are how we learn.`;
        }

        gameArea.innerHTML = `
          <div class="session-complete">
            <div class="trophy">${icon}</div>
            <h2>${title}</h2>
            <p>${msg}</p>
            <div class="buttons">
              <button class="continue-btn" id="continueBtn">Continue · New Session</button>
              <button class="home-btn" id="homeBtn">Back to Home</button>
            </div>
          </div>
        `;
        document.getElementById("continueBtn").addEventListener("click", () => {
          sessionAnswered = 0;
          sessionCorrect = 0;
          sessionComplete = false;
          sessionCap = resolveSessionCap();
          if (typeof restoreGameArea === "function") restoreGameArea();
          updateSessionCounter();
          updateGroupProgressBar();
          updateGroupTabs();
          if (typeof resetMixedRun === "function") resetMixedRun();
          nextCard();
        });
        document.getElementById("homeBtn").addEventListener("click", () => {
          window.location.href = "K12-Kana-Hub.html";
        });
      }

      // ============================================================
      // LISTENING CARD
      // ============================================================
      function renderListeningCard(char) {
        gameArea.innerHTML = `
          <button class="speaker-btn" id="speakerBtn" title="Play sound">🔊</button>
          <div class="instruction">Tap the kana you hear</div>
          <div class="grid" id="grid"></div>
          <div class="card-progress">
            <span id="cardProgressLabel">New</span>
            <div class="card-progress-bar"><div class="card-progress-fill" id="cardProgressFill"></div></div>
          </div>
        `;

        const gridEl     = getGridEl();
        const speakerBtn = getSpeakerBtn();

        currentGrid.forEach(c => {
          const btn = document.createElement("button");
          btn.className = "cell";
          btn.innerText = c;
          btn.dataset.char = c;
          if ([...c].length > 1) btn.dataset.length = "2";
          btn.addEventListener("click", () => handleListeningTap(c, btn));
          gridEl.appendChild(btn);
        });

        speakerBtn.addEventListener("click", () => {
          clearTimeout(autoSpeakTimeout);
          speakKana(char);
        });

        updateCardProgress();

        if (AUTO_PLAY) {
          clearTimeout(autoSpeakTimeout);
          autoSpeakTimeout = setTimeout(() => speakKana(char), 250);
        }
      }

      function handleListeningTap(char, btn) {
        if (isAnswered || sessionComplete) return;
        clearTimeout(autoSpeakTimeout);
        isAnswered = true;

        const correct = isHomophoneMatch(char, currentChar);
        const exact = char === currentChar;

        const grid = getGridEl();
        if (grid) {
          grid.querySelectorAll(".cell").forEach(c => {
            c.classList.add("disabled");
            if (c.dataset.char === currentChar) c.classList.add(correct ? "correct" : "reveal");
          });
        }
        if (!exact) {
          if (correct) btn.classList.add("correct");
          else btn.classList.add("wrong");
        }

        recordListeningAnswer(SCRIPT, currentChar, correct);
        if (correct) sessionCorrect++;
        sessionAnswered++;
        updateSessionCounter();
        updateCardProgress();
        updateGroupProgressBar();

        const capReached = (sessionAnswered >= sessionCap);
        setTimeout(() => {
          if (capReached) showSessionComplete();
          else nextCard();
        }, correct ? 550 : 1100);
      }

      // ============================================================
      // READING CARD
      // ============================================================
      function renderReadingCard(char) {
        gameArea.innerHTML = `
          <div class="target-kana" id="targetKana">${char}</div>
          <div class="instruction" id="instruction">Tap a speaker to hear a sound · tap again to answer</div>
          <div class="grid" id="grid"></div>
          <div class="card-progress">
            <span id="cardProgressLabel">New</span>
            <div class="card-progress-bar"><div class="card-progress-fill" id="cardProgressFill"></div></div>
          </div>
        `;

        const gridEl      = getGridEl();
        const targetEl    = getTargetKana();
        const instruction = getInstruction();

        if ([...char].length > 1) targetEl.classList.add("digraph");

        currentGrid.forEach(c => {
          const btn = document.createElement("button");
          btn.className = "tile";
          btn.dataset.char = c;
          btn.innerHTML = `<span class="speaker-glyph">🔊</span>`;
          btn.title = "Tap to hear, tap again to answer";
          btn.addEventListener("click", () => handleReadingTap(c, btn, instruction));
          gridEl.appendChild(btn);
        });

        targetEl.addEventListener("click", () => {
          clearTimeout(autoSpeakTimeout);
          speakKana(char);
        });

        updateCardProgress();

        if (AUTO_PLAY) {
          clearTimeout(autoSpeakTimeout);
          autoSpeakTimeout = setTimeout(() => speakKana(char), 250);
        }
      }

      function handleReadingTap(char, btn, instructionEl) {
        if (isAnswered || sessionComplete) return;
        clearTimeout(autoSpeakTimeout);

        if (listenedChar !== char) {
          const grid = getGridEl();
          if (grid) grid.querySelectorAll(".tile").forEach(t => t.classList.remove("listened"));
          listenedChar = char;
          btn.classList.add("listened");
          if (instructionEl) instructionEl.innerText = "Tap again to confirm this sound";
          speakKana(char);
          return;
        }

        isAnswered = true;
        const correct = isHomophoneMatch(char, currentChar);
        const exact = char === currentChar;

        const grid = getGridEl();
        if (grid) {
          grid.querySelectorAll(".tile").forEach(t => {
            t.classList.add("disabled");
            t.classList.remove("listened");
            if (t.dataset.char === currentChar) t.classList.add(correct ? "correct" : "reveal");
          });
        }
        if (!exact) {
          if (correct) btn.classList.add("correct");
          else btn.classList.add("wrong");
        }

        speakKana(currentChar);

        recordReadingAnswer(SCRIPT, currentChar, correct);
        sessionAnswered++;
        updateSessionCounter();
        updateCardProgress();
        updateGroupProgressBar();

        const capReached = (sessionAnswered >= sessionCap);
        setTimeout(() => {
          if (capReached) showSessionComplete();
          else nextCard();
        }, correct ? 700 : 1300);
      }

      // ============================================================
      // CARD FLOW / ROUTER
      // ============================================================
      function nextCard() {
        if (sessionComplete) return;

        if (!groupUnlocked(SCRIPT, currentGroup)) {
          const unlocked = unlockedGroups(SCRIPT);
          currentGroup = unlocked[unlocked.length - 1] || "basic";
          sessionCap = resolveSessionCap();
          updateSessionCounter();
        }

        const char = pickNextKana(SCRIPT, currentGroup);
        if (!char) { showToast("No kana available in this group."); return; }

        currentChar = char;
        listenedChar = null;
        isAnswered = false;

        currentDirection = pickDirection(SCRIPT, char);
        currentGrid = buildGridPool(SCRIPT, currentGroup, char, GRID_SIZE);

        updateModeIndicator(currentDirection);
        updateGroupTabs();

        if (currentDirection === "listening") {
          renderListeningCard(char);
        } else {
          renderReadingCard(char);
        }
      }

      // ============================================================
      // EVENTS
      // ============================================================
      document.getElementById("backBtn").addEventListener("click", () => {
        window.location.href = "K12-Kana-Hub.html";
      });

      document.getElementById("resetBtn").addEventListener("click", () => {
        if (!confirm(`Reset all ${SCRIPT} progress? This cannot be undone.`)) return;
        resetAllState();
        resetMixedRun();
        sessionAnswered = 0;
        sessionCorrect = 0;
        sessionComplete = false;
        sessionCap = resolveSessionCap();
        updateGroupProgressBar();
        updateGroupTabs();
        updateSessionCounter();
        updateModeIndicator(null);
        nextCard();
        showToast("Progress reset.");
      });

      autoPlayBtn.addEventListener("click", toggleAutoPlay);

      sessionBtns.forEach(btn => {
        btn.addEventListener("click", () => setSessionSize(btn.dataset.size));
      });

      modeTabs.addEventListener("click", (e) => {
        const tab = e.target.closest(".mode-tab");
        if (!tab || tab.disabled) return;
        const g = tab.dataset.group;
        if (g === currentGroup) return;
        currentGroup = g;
        sessionCap = resolveSessionCap();
        if (sessionAnswered >= sessionCap && sessionAnswered > 0) {
          updateGroupTabs();
          updateGroupProgressBar();
          updateSessionCounter();
          showSessionComplete();
          return;
        }
        updateSessionCounter();
        updateGroupTabs();
        updateGroupProgressBar();
        if (!sessionComplete) {
          resetMixedRun();
          nextCard();
        }
      });

      // ============================================================
      // INIT
      // ============================================================
      loadAutoPlayPref();
      loadSessionPref();
      updateAutoPlayButton();
      updateSessionButtons();
      initState();
      resetMixedRun();
      sessionCap = resolveSessionCap();
      updateSessionCounter();
      updateGroupTabs();
      updateGroupProgressBar();
      updateModeIndicator(null);
      nextCard();

      if (window.speechSynthesis) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
      }
    </script>
  </body>
