<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Katakana Match · Kana to Kana</title>

    <!-- PWA META TAGS -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Katakana Match" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />

    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      body {
        background: #111111;
        color: #ffffff;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        font-family: "Segoe UI", "Noto Sans JP", "Roboto", system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }

      /* TOP BAR */
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
        padding-top: max(20px, env(safe-area-inset-top));
        z-index: 10;
      }

      .top-bar-left {
        display: flex;
        gap: 4px;
        align-items: center;
      }

      .nav-btn {
        background: transparent;
        border: none;
        color: #ffffff;
        font-size: 1.4rem;
        cursor: pointer;
        padding: 8px 12px;
        line-height: 1;
        opacity: 0.6;
        transition: opacity 0.15s;
        border-radius: 12px;
      }
      .nav-btn:hover { opacity: 1; background: rgba(255,255,255,0.1); }

      .score-container {
        display: flex;
        gap: 20px;
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: 1px;
      }

      .score-correct {
        color: #00e676;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .score-wrong {
        color: #d500f9;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .progress-bar-container {
        width: 100%;
        height: 4px;
        background: #333333;
        margin-top: -4px;
        z-index: 10;
      }

      .progress-bar {
        height: 100%;
        background: #ffd54f;
        width: 0%;
        transition: width 0.3s ease;
      }

      /* MAIN GAME AREA */
      .game-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        position: relative;
      }

      /* THE BIG KATAKANA */
      .target-kana {
        font-size: 12rem;
        font-weight: 900;
        line-height: 1;
        cursor: pointer;
        transition: transform 0.1s ease, opacity 0.2s ease;
        font-family: "Noto Sans JP", sans-serif;
        margin-bottom: 12px;
        text-align: center;
        animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .target-kana:active {
        transform: scale(0.92);
      }

      .target-kana.speaking {
        color: #ffd54f;
      }

      /* STREAK INDICATOR DOTS */
      .streak-indicator {
        display: flex;
        gap: 10px;
        margin-bottom: 32px;
        height: 16px;
        align-items: center;
        justify-content: center;
      }

      .streak-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid #444;
        background: transparent;
        transition: all 0.25s ease;
      }

      .streak-dot.filled {
        background: #00e676;
        border-color: #00e676;
        box-shadow: 0 0 8px rgba(0, 230, 118, 0.5);
      }

      /* 2x2 GRID FOR HIRAGANA OPTIONS */
      .options-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        width: 100%;
        max-width: 400px;
      }

      .option-btn {
        background: #1e1e1e;
        border: 3px solid #333333;
        color: #ffffff;
        font-size: 3rem;
        font-weight: 800;
        padding: 30px 0;
        border-radius: 24px;
        cursor: pointer;
        transition: all 0.15s ease;
        font-family: "Noto Sans JP", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 4px 0 #000000;
      }

      .option-btn:active:not(:disabled) {
        transform: translateY(4px);
        box-shadow: 0 0 0 #000000;
      }

      .option-btn.correct {
        background: #00e676;
        border-color: #00e676;
        color: #000000;
        box-shadow: 0 4px 0 #009624;
      }

      .option-btn.wrong {
        background: #d500f9;
        border-color: #d500f9;
        color: #ffffff;
        box-shadow: 0 4px 0 #9c00b3;
      }

      .option-btn.disabled {
        pointer-events: none;
        opacity: 0.5;
      }

      /* ANIMATIONS */
      @keyframes popIn {
        0% { transform: scale(0.8); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }

      /* SIGNATURE PILL (Elongated) */
      .antonio-signature {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        height: 40px;
        width: auto;
        min-width: 100px;
        border-radius: 20px;
        object-fit: contain;
        cursor: pointer;
        border: 2px solid #333;
        opacity: 0.6;
        transition: opacity 0.2s;
        z-index: 20;
        background: #ffffff;
        padding: 2px 12px;
      }
      .antonio-signature:hover { opacity: 1; }

      /* SIGNATURE MODAL */
      .signature-modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px);
        display: flex; justify-content: center; align-items: center;
        z-index: 9999; opacity: 0; visibility: hidden; transition: opacity 0.3s ease;
      }
      .signature-modal-overlay.active { opacity: 1; visibility: visible; }
      .signature-modal {
        background: #fff7ec; border-radius: 30px; padding: 2rem 1.8rem;
        text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        border: 3px solid #d4a94a; max-width: 90vw; width: 320px;
        color: #2d3e2a; transform: scale(0.9); transition: transform 0.3s;
      }
      .signature-modal-overlay.active .signature-modal { transform: scale(1); }
      .signature-modal img {
        width: 100%; height: auto; max-height: 160px; border-radius: 16px;
        border: 2px solid #eedfc2; background: white; padding: 6px; margin-bottom: 1.5rem;
      }
      .signature-modal h2 { margin: 0 0 8px 0; font-size: 1.5rem; }
      .signature-modal p { margin: 0; font-size: 0.95rem; line-height: 1.5; }
      .signature-modal button {
        margin-top: 20px; background: #4a6a7a; color: white; border: none;
        padding: 8px 24px; border-radius: 50px; font-weight: bold; cursor: pointer;
        box-shadow: 0 4px 0 #2a4a5a; font-family: inherit;
      }

      .toast-popup {
        position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-10px);
        background: #333; color: #fff; padding: 10px 20px; border-radius: 40px;
        font-size: 0.85rem; font-weight: 600; z-index: 9000; opacity: 0;
        pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease;
        max-width: 90vw; text-align: center;
      }
      .toast-popup.show { opacity: 1; transform: translateX(-50%) translateY(0); }

      /* PAUSE SCREEN */
      .pause-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(17, 17, 17, 0.95); z-index: 50;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        opacity: 0; visibility: hidden; transition: opacity 0.2s ease;
      }
      .pause-overlay.active { opacity: 1; visibility: visible; }
      .pause-overlay h2 { font-size: 2rem; margin-bottom: 20px; }
      .pause-overlay button {
        background: #00e676; color: #000; border: none; padding: 16px 40px;
        border-radius: 50px; font-size: 1.1rem; font-weight: 800; margin-bottom: 12px;
        cursor: pointer; width: 260px; font-family: inherit;
      }
      .pause-overlay button.secondary {
        background: #333; color: #fff;
      }

      /* MASTERED CELEBRATION MODAL */
      .mastered-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(17, 17, 17, 0.95); z-index: 60;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        padding: 20px;
        opacity: 0; visibility: hidden; transition: opacity 0.3s ease;
        text-align: center;
      }
      .mastered-overlay.active { opacity: 1; visibility: visible; }
      .mastered-overlay .trophy {
        font-size: 5rem;
        margin-bottom: 16px;
        animation: bounce 1.5s ease-in-out infinite;
      }
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
      }
      .mastered-overlay h2 {
        font-size: 1.8rem;
        margin-bottom: 8px;
        color: #00e676;
      }
      .mastered-overlay p {
        font-size: 1rem;
        color: #aaa;
        margin-bottom: 32px;
        max-width: 300px;
        line-height: 1.5;
      }
      .mastered-overlay button {
        background: #00e676; color: #000; border: none; padding: 16px 40px;
        border-radius: 50px; font-size: 1.1rem; font-weight: 800; margin-bottom: 12px;
        cursor: pointer; width: 260px; font-family: inherit;
      }
      .mastered-overlay button.secondary {
        background: #333; color: #fff;
      }
    </style>
  </head>
  <body>
    <!-- TOP BAR -->
    <div class="top-bar">
      <div class="top-bar-left">
        <button class="nav-btn" id="backBtn" title="Back to Word Flashcards">← Back</button>
        <button class="nav-btn" id="pauseBtn" title="Pause">⏸</button>
      </div>
      <div class="score-container">
        <div class="score-correct">
          <span>✔</span> <span id="correctScore">0</span>
        </div>
        <div class="score-wrong">
          <span>✖</span> <span id="wrongScore">0</span>
        </div>
      </div>
    </div>

    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- SIGNATURE PILL -->
    <img src="icons/Antonio.png" alt="ACG" class="antonio-signature" id="antonioSignature" />

    <!-- GAME AREA -->
    <div class="game-area" id="gameArea">
      <div class="target-kana" id="targetKana">ア</div>

      <!-- STREAK DOTS -->
      <div class="streak-indicator" id="streakIndicator">
        <div class="streak-dot" id="dot1"></div>
        <div class="streak-dot" id="dot2"></div>
      </div>

      <div class="options-grid" id="optionsGrid">
        <!-- Dynamically populated -->
      </div>
    </div>

    <!-- PAUSE SCREEN -->
    <div class="pause-overlay" id="pauseOverlay">
      <h2>Paused</h2>
      <button id="resumeBtn">▶ Resume</button>
      <button class="secondary" id="replayBtn">🔁 Replay From Start</button>
      <button class="secondary" id="resetBtn">⟳ Reset Progress</button>
      <button class="secondary" id="exitBtn">📖 Word Flashcards</button>
    </div>

    <!-- MASTERED CELEBRATION -->
    <div class="mastered-overlay" id="masteredOverlay">
      <div class="trophy">🏆</div>
      <h2>All Katakana Mastered!</h2>
      <p>You got every single one right twice in a row. That's real mastery.</p>
      <button id="masteredReplayBtn">🔁 Play Again</button>
      <button class="secondary" id="masteredResetBtn">⟳ Reset Progress</button>
    </div>

    <!-- SIGNATURE MODAL -->
    <div class="signature-modal-overlay" id="signatureModal">
      <div class="signature-modal">
        <img src="icons/Antonio.png" alt="ACG Applications Signature" />
        <h2>ACG Applications</h2>
        <p>Kanji Master &amp; Katakana Study<br>Built with care. 漢字 &amp; カタカナ.<br><br><span style="font-size:0.8rem; opacity:0.8;">Built with DeepSeek</span></p>
        <button id="closeSigBtn">Close</button>
      </div>
    </div>

    <div class="toast-popup" id="toastPopup"></div>

    <script>
      // ============================================================
      // DATA: FULL KATAKANA TO HIRAGANA MAPPING
      // ============================================================
      const KANA_DATA = [
        { k: "ア", h: "あ" }, { k: "イ", h: "い" }, { k: "ウ", h: "う" }, { k: "エ", h: "え" }, { k: "オ", h: "お" },
        { k: "カ", h: "か" }, { k: "キ", h: "き" }, { k: "ク", h: "く" }, { k: "ケ", h: "け" }, { k: "コ", h: "こ" },
        { k: "サ", h: "さ" }, { k: "シ", h: "し" }, { k: "ス", h: "す" }, { k: "セ", h: "せ" }, { k: "ソ", h: "そ" },
        { k: "タ", h: "た" }, { k: "チ", h: "ち" }, { k: "ツ", h: "つ" }, { k: "テ", h: "て" }, { k: "ト", h: "と" },
        { k: "ナ", h: "な" }, { k: "ニ", h: "に" }, { k: "ヌ", h: "ぬ" }, { k: "ネ", h: "ね" }, { k: "ノ", h: "の" },
        { k: "ハ", h: "は" }, { k: "ヒ", h: "ひ" }, { k: "フ", h: "ふ" }, { k: "ヘ", h: "へ" }, { k: "ホ", h: "ほ" },
        { k: "マ", h: "ま" }, { k: "ミ", h: "み" }, { k: "ム", h: "む" }, { k: "メ", h: "め" }, { k: "モ", h: "も" },
        { k: "ヤ", h: "や" }, { k: "ユ", h: "ゆ" }, { k: "ヨ", h: "よ" },
        { k: "ラ", h: "ら" }, { k: "リ", h: "り" }, { k: "ル", h: "る" }, { k: "レ", h: "れ" }, { k: "ロ", h: "ろ" },
        { k: "ワ", h: "わ" }, { k: "ヲ", h: "を" }, { k: "ン", h: "ん" },
        // Dakuten
        { k: "ガ", h: "が" }, { k: "ギ", h: "ぎ" }, { k: "グ", h: "ぐ" }, { k: "ゲ", h: "げ" }, { k: "ゴ", h: "ご" },
        { k: "ザ", h: "ざ" }, { k: "ジ", h: "じ" }, { k: "ズ", h: "ず" }, { k: "ゼ", h: "ぜ" }, { k: "ゾ", h: "ぞ" },
        { k: "ダ", h: "だ" }, { k: "ヂ", h: "ぢ" }, { k: "ヅ", h: "づ" }, { k: "デ", h: "で" }, { k: "ド", h: "ど" },
        { k: "バ", h: "ば" }, { k: "ビ", h: "び" }, { k: "ブ", h: "ぶ" }, { k: "ベ", h: "べ" }, { k: "ボ", h: "ぼ" },
        // Handakuten
        { k: "パ", h: "ぱ" }, { k: "ピ", h: "ぴ" }, { k: "プ", h: "ぷ" }, { k: "ペ", h: "ぺ" }, { k: "ポ", h: "ぽ" },
      ];

      const REQUIRED_STREAK = 2;

      // ============================================================
      // STATE
      // ============================================================
      const STORAGE_KEY_V2 = "katakanaMatchStreaks_v2";
      const STORAGE_KEY_V1_LEGACY = "katakanaMatchMastery_v1";

      let streaks = {}; // { "ア": 0, "イ": 1, "ウ": 2, ... }
      let currentQuestion = null;
      let options = [];
      let correctScore = 0;
      let wrongScore = 0;
      let isAnswered = false;
      let isPaused = false;
      let autoNextTimeout = null;

      // DOM Elements
      const targetKanaEl = document.getElementById("targetKana");
      const optionsGrid = document.getElementById("optionsGrid");
      const correctScoreEl = document.getElementById("correctScore");
      const wrongScoreEl = document.getElementById("wrongScore");
      const progressBar = document.getElementById("progressBar");
      const pauseOverlay = document.getElementById("pauseOverlay");
      const masteredOverlay = document.getElementById("masteredOverlay");
      const toastPopup = document.getElementById("toastPopup");
      const dot1 = document.getElementById("dot1");
      const dot2 = document.getElementById("dot2");

      // ============================================================
      // AUDIO & TOAST
      // ============================================================
      let audioCtx = null;

      function playSound(type) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === "correct") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(880, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
          osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        } else {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(220, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
          osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }
      }

      function showToast(msg) {
        toastPopup.innerText = msg;
        toastPopup.classList.add("show");
        setTimeout(() => toastPopup.classList.remove("show"), 2200);
      }

      function speakKatakana(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();

        // Silent primer to wake up TTS engine
        const primer = new SpeechSynthesisUtterance(" ");
        primer.volume = 0;
        window.speechSynthesis.speak(primer);
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "ja-JP";
        utterance.rate = 0.85;
        const voices = window.speechSynthesis.getVoices();
        const jp = voices.find(v => v.lang.startsWith("ja"));
        if (jp) utterance.voice = jp;

        utterance.onstart = () => targetKanaEl.classList.add("speaking");
        utterance.onend = () => targetKanaEl.classList.remove("speaking");
        utterance.onerror = () => targetKanaEl.classList.remove("speaking");

        window.speechSynthesis.speak(utterance);
      }

      // ============================================================
      // PERSISTENCE
      // ============================================================
      function loadStreaks() {
        try {
          const savedV2 = localStorage.getItem(STORAGE_KEY_V2);
          if (savedV2) {
            const parsed = JSON.parse(savedV2);
            if (parsed && typeof parsed === "object") {
              streaks = parsed;
              return;
            }
          }
        } catch (e) {
          console.warn("Failed to load v2 streaks", e);
        }

        try {
          const savedV1 = localStorage.getItem(STORAGE_KEY_V1_LEGACY);
          if (savedV1) {
            const arr = JSON.parse(savedV1);
            if (Array.isArray(arr)) {
              arr.forEach(kana => { streaks[kana] = REQUIRED_STREAK; });
              saveStreaks();
              localStorage.removeItem(STORAGE_KEY_V1_LEGACY);
              showToast(`Migrated ${arr.length} mastered Katakana to new streak format.`);
              console.log(`[streaks] Migrated ${arr.length} from v1`);
            }
          }
        } catch (e) {
          console.warn("Failed to migrate v1", e);
        }
      }

      function saveStreaks() {
        try {
          localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(streaks));
        } catch (e) {
          console.warn("Failed to save streaks", e);
        }
      }

      // ============================================================
      // GAME LOGIC
      // ============================================================
      function updateProgressBar() {
        const totalStreakPoints = KANA_DATA.reduce(
          (sum, item) => sum + Math.min(streaks[item.k] || 0, REQUIRED_STREAK),
          0
        );
        const maxPoints = KANA_DATA.length * REQUIRED_STREAK;
        const percentage = (totalStreakPoints / maxPoints) * 100;
        progressBar.style.width = percentage + "%";
      }

      function updateStreakDots(kana) {
        const s = streaks[kana] || 0;
        dot1.classList.toggle("filled", s >= 1);
        dot2.classList.toggle("filled", s >= 2);
      }

      function shuffleArray(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function startNewQuestion() {
        if (isPaused) return;
        clearTimeout(autoNextTimeout);
        isAnswered = false;
        targetKanaEl.classList.remove("speaking");

        const available = KANA_DATA.filter(
          item => (streaks[item.k] || 0) < REQUIRED_STREAK
        );

        if (available.length === 0) {
          showMasteredCelebration();
          return;
        }

        const randomIndex = Math.floor(Math.random() * available.length);
        currentQuestion = available[randomIndex];
        targetKanaEl.innerText = currentQuestion.k;
        updateStreakDots(currentQuestion.k);

        const wrongPool = KANA_DATA.filter(item => item.h !== currentQuestion.h);
        const wrongOptions = shuffleArray(wrongPool).slice(0, 3).map(item => item.h);
        options = shuffleArray([currentQuestion.h, ...wrongOptions]);

        optionsGrid.innerHTML = "";
        options.forEach(hira => {
          const btn = document.createElement("button");
          btn.className = "option-btn";
          btn.innerText = hira;
          btn.onclick = () => handleAnswer(hira, btn);
          optionsGrid.appendChild(btn);
        });
      }

      function handleAnswer(selectedHira, btnEl) {
        if (isAnswered) return;
        isAnswered = true;

        const isCorrect = selectedHira === currentQuestion.h;
        const kana = currentQuestion.k;
        const prevStreak = streaks[kana] || 0;

        document.querySelectorAll(".option-btn").forEach(btn => {
          btn.classList.add("disabled");
          if (btn.innerText === currentQuestion.h) {
            btn.classList.add("correct");
          }
        });

        if (isCorrect) {
          correctScore++;
          correctScoreEl.innerText = correctScore;
          btnEl.classList.add("correct");
          playSound("correct");
          speakKatakana(kana);

          streaks[kana] = prevStreak + 1;
          saveStreaks();
          updateProgressBar();
          updateStreakDots(kana);

          if (streaks[kana] === REQUIRED_STREAK) {
            showToast(`✨ "${kana}" mastered!`);
          }

          autoNextTimeout = setTimeout(startNewQuestion, 800);
        } else {
          wrongScore++;
          wrongScoreEl.innerText = wrongScore;
          btnEl.classList.add("wrong");
          playSound("wrong");
          speakKatakana(kana);

          // TARGET: full reset
          streaks[kana] = 0;

          // DISTRACTOR: partial demotion (Interpretation 3)
          if (selectedHira !== kana && selectedHira !== currentQuestion.h) {
            const distractorKana = KANA_DATA.find(item => item.h === selectedHira)?.k;
            if (distractorKana && streaks[distractorKana] > 0) {
              const prevDistractorStreak = streaks[distractorKana];
              streaks[distractorKana] = prevDistractorStreak - 1;
              if (prevDistractorStreak >= REQUIRED_STREAK) {
                showToast(`"${distractorKana}" weakened — one wrong tap noticed.`);
              }
            }
          }

          saveStreaks();
          updateProgressBar();
          updateStreakDots(kana);

          autoNextTimeout = setTimeout(startNewQuestion, 1500);
        }
      }

      // ============================================================
      // MASTERED CELEBRATION
      // ============================================================
      function showMasteredCelebration() {
        isPaused = true;
        masteredOverlay.classList.add("active");
      }

      function hideMasteredCelebration() {
        masteredOverlay.classList.remove("active");
        isPaused = false;
      }

      function replayFromStart() {
        streaks = {};
        saveStreaks();
        updateProgressBar();
        correctScore = 0;
        wrongScore = 0;
        correctScoreEl.innerText = 0;
        wrongScoreEl.innerText = 0;
        hideMasteredCelebration();
        pauseOverlay.classList.remove("active");
        isPaused = false;
        startNewQuestion();
      }

      // ============================================================
      // EVENTS
      // ============================================================
      targetKanaEl.addEventListener("click", () => {
        if (currentQuestion) speakKatakana(currentQuestion.k);
      });

      document.getElementById("backBtn").addEventListener("click", () => {
        window.location.href = "K7-Katakana.html";
      });

      document.getElementById("pauseBtn").addEventListener("click", () => {
        isPaused = true;
        pauseOverlay.classList.add("active");
        clearTimeout(autoNextTimeout);
      });

      document.getElementById("resumeBtn").addEventListener("click", () => {
        isPaused = false;
        pauseOverlay.classList.remove("active");
        if (isAnswered) {
          startNewQuestion();
        }
      });

      document.getElementById("replayBtn").addEventListener("click", () => {
        if (confirm("🔁 Replay from start? This clears all your current streaks.")) {
          replayFromStart();
        }
      });

      document.getElementById("resetBtn").addEventListener("click", () => {
        if (confirm("Reset all katakana mastery progress?")) {
          replayFromStart();
        }
      });

      document.getElementById("exitBtn").addEventListener("click", () => {
        window.location.href = "K7-Katakana.html";
      });

      document.getElementById("masteredReplayBtn").addEventListener("click", () => {
        replayFromStart();
      });

      document.getElementById("masteredResetBtn").addEventListener("click", () => {
        if (confirm("Reset all progress?")) {
          replayFromStart();
        }
      });

      // Signature modal
      document.getElementById("antonioSignature").addEventListener("click", () => {
        document.getElementById("signatureModal").classList.add("active");
      });
      document.getElementById("closeSigBtn").addEventListener("click", () => {
        document.getElementById("signatureModal").classList.remove("active");
      });
      document.getElementById("signatureModal").addEventListener("click", (e) => {
        if (e.target.id === "signatureModal") {
          document.getElementById("signatureModal").classList.remove("active");
        }
      });

      // ============================================================
      // INIT
      // ============================================================
      loadStreaks();
      updateProgressBar();
      startNewQuestion();
    </script>
  </body>
</html>
